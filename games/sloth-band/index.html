<!doctype html>
<html lang="en">
<head>
<script src="../../shared/web-audio-unlock.js"></script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#2e7d32">
  <title>Sloth Band vs. Platypus</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="../../shared/kq-i18n/kq-i18n.js"></script>
  <script src="js/i18n.js"></script>
</head>
<body>
  <canvas id="game" aria-label="Sloth Band vs. Platypus play field"></canvas>

  <div id="hud" class="hidden">
    <div class="hud-left">
      <div id="hud-level"></div>
      <div id="hud-score">0</div>
    </div>
    <div class="hud-right">
      <div class="coins"><span class="coin"></span><span id="hud-coins">0</span></div>
      <button id="btn-restart" class="icon" aria-label="Restart level"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M19 12a7 7 0 1 1-2.05-4.95" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/><path d="M17.5 3.5v4.2h-4.2" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button id="btn-pause" class="icon" aria-label="Pause"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><rect x="6" y="5" width="4.2" height="14" rx="1.4" fill="currentColor"/><rect x="13.8" y="5" width="4.2" height="14" rx="1.4" fill="currentColor"/></svg></button>
    </div>
  </div>
  <div id="hud-tip" class="hidden"><canvas id="tip-face" width="88" height="88"></canvas><span id="tip-text"></span></div>

  <section id="screen-title" class="screen">
    <div class="panel title-panel">
      <div class="logo" data-kq-notr>
        <span class="l1">Sloth Band</span>
        <span class="l2">vs.</span>
        <span class="l3">Platypus</span>
      </div>
      <p class="tagline">The platypuses stole the stage. Launch the band and take it back!</p>
      <div class="band-row" id="band-row"></div>
      <button id="btn-play" class="big">Play</button>
      <div class="title-foot">
        <div class="coins"><span class="coin"></span><span id="title-coins">0</span> coins</div>
        <button id="btn-mute" class="small"></button>
          <select data-kq-lang="short" aria-label="Language"></select>
      </div>
      <p class="credit" data-kq-notr>Known Quantity</p>
    </div>
  </section>

  <section id="screen-levels" class="screen hidden">
    <div class="panel">
      <h2>Set List</h2>
      <div id="level-grid"></div>
      <button id="btn-levels-back" class="small">Back</button>
    </div>
  </section>

  <section id="screen-pause" class="screen hidden">
    <div class="panel">
      <h2>Paused</h2>
      <button id="btn-resume" class="big">Resume</button>
      <div class="row">
        <button id="btn-pause-restart">Restart</button>
        <button id="btn-pause-levels">Set List</button>
      </div>
      <button id="btn-pause-mute" class="small"></button>
    </div>
  </section>

  <section id="screen-result" class="screen hidden">
    <div class="panel">
      <h2 id="result-title"></h2>
      <div class="stars" id="result-stars"><span></span><span></span><span></span></div>
      <div id="result-score"></div>
      <div id="result-detail"></div>
      <div id="result-coins"></div>
      <div class="row">
        <button id="btn-result-levels">Set List</button>
        <button id="btn-result-retry">Retry</button>
        <button id="btn-result-next" class="primary">Next</button>
      </div>
    </div>
  </section>

  <div id="rotate-hint" class="hidden">
    <div class="phone"></div>
    <p>Turn your phone sideways for the best show.</p>
    <button id="btn-rotate-dismiss" class="small">Play anyway</button>
  </div>

  <script src="vendor/matter.min.js"></script>
  <script src="js/kq-profile.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/levels.js"></script>
  <script src="js/art.js"></script>
  <script src="js/game.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
