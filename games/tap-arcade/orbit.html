<!doctype html>
<html lang="en">
<head>
<script src="../../shared/web-audio-unlock.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0d0f1a">
<title>Orbit Hop</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="kq-i18n-fonts.css">
<script src="kq-i18n.js"></script>
<script src="i18n.js"></script>
<script src="ads.js"></script>
<style>
/* Layout: full-screen canvas, HUD pinned top, cards centered. Single dark arcade look by choice. */
:root{
  --bg:#0d0f1a; --fg:#f2f0ff; --muted:#8c8ab0;
  --accent:#4dd4ac; --accent-shadow:#2a8a6e; --accent-ink:#14101c; --pink:#ff5d8f; --panel:#161a2d;
  --display:'Rubik Mono One',Impact,'Arial Black',sans-serif; --body:'Rubik',system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--fg);font-family:var(--body);
  -webkit-user-select:none;user-select:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
#game{position:fixed;inset:0;width:100%;height:100%;display:block}
.hud{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;
  padding-top:calc(env(safe-area-inset-top,0px) + 12px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  pointer-events:none;font-variant-numeric:tabular-nums;z-index:2}
.score{font-family:var(--display);font-size:clamp(44px,11vw,72px);line-height:1;text-shadow:0 4px 0 rgba(0,0,0,.35);transition:transform .12s;transform-origin:left top}
.score.bump{transform:scale(1.14)}
.right{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.btns{display:flex;gap:8px}
.left{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.powers{display:flex;flex-direction:column;gap:5px}
.pchip{position:relative;overflow:hidden;display:flex;align-items:center;gap:6px;font:700 12px var(--body);color:#14101c;background:var(--pc);border-radius:999px;padding:4px 10px 4px 6px;letter-spacing:.02em;box-shadow:0 0 14px color-mix(in srgb,var(--pc) 60%,transparent);animation:pin .25s cubic-bezier(.2,.9,.3,1.3)}
.pchip i{display:block;width:14px;height:14px;border-radius:50%;background:rgba(20,16,28,.25)}
.pchip .bar{position:absolute;left:0;bottom:0;height:3px;background:rgba(20,16,28,.45)}
@keyframes pin{from{transform:scale(.4);opacity:0}}
.best{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600;text-align:right;padding-top:6px}
.best b{display:block;font-size:22px;color:var(--accent);letter-spacing:0;font-weight:700}
.link{background:none;border:0;color:var(--muted);font:600 14px var(--body);cursor:pointer;padding:6px 10px;text-decoration:underline;text-underline-offset:3px}
.ring{position:relative;width:84px;height:84px;display:grid;place-items:center}
.ring svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:6}
.ring .track{stroke:rgba(255,255,255,.1)}
.ring .arc{stroke:var(--accent);stroke-linecap:round;stroke-dasharray:213.6;stroke-dashoffset:0}
.ring span{font-family:var(--display);font-size:30px;font-variant-numeric:tabular-nums}
.setup{display:flex;flex-direction:column;gap:8px;width:100%;text-align:left}
#start[data-noautostart]{gap:8px;padding:20px 18px}
#start[data-noautostart] .hint:empty{display:none}
.setup .grp{display:flex;flex-direction:column;gap:6px}
.setup .lbl{font-size:11px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:600 13px var(--body);color:var(--fg);background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:999px;padding:6px 10px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip{white-space:nowrap;display:inline-flex;align-items:center;gap:6px;flex:none}
.chip .dot{width:9px;height:9px;border-radius:50%;box-shadow:0 0 0 1px rgba(255,255,255,.35)}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;-webkit-mask-image:linear-gradient(90deg,#000 86%,transparent);mask-image:linear-gradient(90deg,#000 86%,transparent)}
.chips.scroll::-webkit-scrollbar{display:none}
.chip:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.icon-btn{pointer-events:auto;text-decoration:none;box-sizing:border-box;width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.08);color:var(--fg);display:grid;place-items:center;cursor:pointer;padding:0}
.icon-btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.icon-btn:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
.card{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(88vw,340px);background:var(--panel);
  border-radius:20px;padding:26px 22px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.55);border:2px solid rgba(255,255,255,.06);z-index:3;
  animation:pop .22s cubic-bezier(.2,.9,.3,1.15);display:flex;flex-direction:column;align-items:center;gap:10px;box-sizing:border-box;max-height:calc(100% - 24px);overflow-y:auto}
@keyframes pop{from{opacity:0;transform:translate(-50%,-50%) scale(.9)}}
.card h1{font-family:var(--display);font-size:32px;margin:0;color:var(--accent);text-wrap:balance;line-height:1.05}
.card h2{font-family:var(--display);font-size:26px;margin:0;line-height:1.1}
.card p{margin:0;color:var(--muted);font-size:15px;line-height:1.45;max-width:28ch}
.card .big{font-family:var(--display);font-size:60px;line-height:1;font-variant-numeric:tabular-nums}
.card .lbl{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
.card .hint{font-size:13px;color:var(--muted);margin-top:4px}
.stats{display:flex;gap:18px;justify-content:center;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.stats b{color:var(--fg);font-weight:600}
.btn{font:600 17px var(--body);background:var(--accent);color:var(--accent-ink);border:0;border-radius:999px;padding:14px 32px;cursor:pointer;
  box-shadow:0 5px 0 var(--accent-shadow);transition:transform .08s,box-shadow .08s;margin-top:8px;min-width:200px}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--accent-shadow)}
.btn:focus-visible{outline:3px solid var(--fg);outline-offset:3px}
.btn.ghost{background:transparent;color:var(--fg);box-shadow:inset 0 0 0 2px rgba(255,255,255,.18);margin-top:0}
.diffbox{justify-content:center}
.diffbox .chip{font-size:12px;padding:5px 10px}
.card .chip{font:600 12.5px var(--body);color:var(--fg);background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:999px;padding:5px 10px;cursor:pointer}
.card .chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.pill{display:inline-block;padding:6px 12px;border-radius:999px;background:rgba(255,93,143,.15);color:var(--pink);font-size:13px;font-weight:600}
@media (prefers-reduced-motion:reduce){.card{animation:none}.btn,.score{transition:none}}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div class="hud">
  <div class="left"><div class="score" id="score">0</div><div class="powers" id="powers"></div></div>
  <div class="right">
    <div class="best">Best<b id="best">0</b></div>
    <div class="btns">
    <button class="icon-btn" id="mute" aria-label="Toggle sound" title="Sound">
      <svg id="icoOn" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16 9a4 4 0 0 1 0 6"/><path d="M18.5 6.5a8 8 0 0 1 0 11"/></svg>
      <svg id="icoOff" viewBox="0 0 24 24" hidden><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16 9l5 6M21 9l-5 6"/></svg>
    </button>
    <button class="icon-btn" id="pauseBtn" aria-label="Pause" title="Pause">
      <svg viewBox="0 0 24 24"><path d="M9 6v12M15 6v12"/></svg>
    </button>
    <a class="icon-btn" id="home" href="index.html" aria-label="Back to menu" title="Menu">
      <svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7"/><path d="M6 10v9h12v-9"/></svg>
    </a>
    </div>
  </div>
</div>
<div class="card" id="cont" hidden>
  <div class="ring"><svg viewBox="0 0 80 80"><circle class="track" cx="40" cy="40" r="34"/><circle class="arc" id="arc" cx="40" cy="40" r="34"/></svg><span id="cnt">5</span></div>
  <h2>Keep going?</h2>
  <p>Pick up right where you were.</p>
  <button class="btn" id="contBtn">Continue</button>
  <button class="link" id="noCont">No thanks</button>
</div>
<div class="card" id="start">
  <h1>Orbit Hop</h1>
  <p>You circle a planet. Tap to launch off along your path and land on the next one. Hit dead center for a bullseye bonus.</p>
  <div class="stats" id="startStats" hidden><span>Best <b id="sBest">0</b></span><span>Games <b id="sGames">0</b></span></div>
  <div class="chips diffbox" id="diffBox" hidden></div>
  
  <button class="btn" id="play">Play</button>
  <div class="hint">or tap anywhere</div>
</div>
<div class="card" id="over" hidden>
  <div class="lbl">Planets reached</div>
  <div class="big" id="final">0</div>
  <div id="bestLine" class="lbl"></div>
  <div class="stats"><span>Games <b id="oGames">0</b></span></div>
  <div class="chips diffbox" id="diffBox2" hidden></div>
  <button class="btn" id="again">Play again</button>
  <button class="btn ghost" id="share">Copy score</button>
  
  <div class="hint">or tap anywhere</div>
</div>
<div class="card" id="pause" hidden><h2>Paused</h2><p>Tap anywhere to resume.</p></div>
<script>
(() => {
'use strict';
if (!CanvasRenderingContext2D.prototype.roundRect) CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r){
  r = Math.min(typeof r === 'number' ? r : 0, w / 2, h / 2); this.moveTo(x + r, y); this.arcTo(x + w, y, x + w, y + h, r); this.arcTo(x + w, y + h, x, y + h, r); this.arcTo(x, y + h, x, y, r); this.arcTo(x, y, x + w, y, r); this.closePath(); };
const $ = id => document.getElementById(id);
// graphics quality: 2 = full, 1 = lighter glow + 1.5x pixels, 0 = no glow + 1x pixels. Drops automatically if frames run slow.
let quality = 2, storedQ = null; try { storedQ = localStorage.getItem('arcade_quality'); if (storedQ === '0' || storedQ === '1') quality = +storedQ; } catch (e) {}
if (storedQ === null && /Android/.test(navigator.userAgent) && ((navigator.deviceMemory || 8) <= 3 || (navigator.hardwareConcurrency || 8) <= 4)) quality = 1;   // modest Android phones start one step down
const cv = $('game'), ctx = cv.getContext('2d');
cv.addEventListener('contextmenu', e => e.preventDefault());
let W = 0, H = 0, ready = false;
function resize(){ const dpr = Math.min(devicePixelRatio || 1, [1, 1.5, 2][quality]); W = innerWidth; H = innerHeight; cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); lastSig = ''; if (ready && Game.resize) Game.resize(); }
addEventListener('resize', resize);

const store = {
  get(k, d){ try { const v = localStorage.getItem('oh_' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v){ try { localStorage.setItem('oh_' + k, JSON.stringify(v)); } catch (e) {} }
};
let best = store.get('best', 0), games = store.get('games', 0), muted = store.get('muted', false);

const Sfx = (() => {
  let ac = null;
  const ok = () => { try { if (!ac) { ac = new (window.AudioContext || window.webkitAudioContext)(); if (window.Ads && Ads.trackAudio) Ads.trackAudio(ac); } if (ac.state === 'suspended' && !document.hidden && !(window.Ads && Ads.showing)) ac.resume(); return ac; } catch (e) { return null; } };
  function tone(freq, dur, type = 'square', vol = 0.1, slideTo = null, delay = 0){
    if (muted) return; const c = ok(); if (!c) return;
    const t = c.currentTime + delay, o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(30, slideTo), t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0008, t + dur);
    o.connect(g).connect(c.destination); o.start(t); o.stop(t + dur + 0.02);
  }
  function noise(dur, vol = 0.1){
    if (muted) return; const c = ok(); if (!c) return;
    const n = Math.floor(c.sampleRate * dur), buf = c.createBuffer(1, n, c.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const s = c.createBufferSource(), g = c.createGain(), f = c.createBiquadFilter();
    f.type = 'lowpass'; f.frequency.value = 900; s.buffer = buf; g.gain.value = vol;
    s.connect(f).connect(g).connect(c.destination); s.start();
  }
  // app sent to the background: silence everything at once; it wakes on the next sound
  const sleep = () => { try { if (ac && ac.state === 'running') ac.suspend(); } catch (e) {} };
  return { unlock: ok, ctx: ok, tone, noise, sleep };
})();
// haptics: the phone's haptic engine in the app (ads.js), navigator.vibrate on the web
const buzz = p => { try { if (window.Haptic) Haptic.play(p); else if (navigator.vibrate) navigator.vibrate(p); } catch (e) {} };

// ---------- music: a procedural loop in the game's key ----------
let SONG = {"root":52,"sfxOct":1,"bpm":96,"vol":0.55,"chords":[[0,"m"],[8,"M"],[3,"M"],[10,"M"]],"bass":[0,null,null,null,7,null,null,null],"bassOct":0,"bassLen":3.5,"bassType":"sine","bassVol":0.16,"arp":[0,2,1,2,3,2,1,2],"arpType":"triangle","arpVol":0.035,"padVol":0.03,"lead":[[7,null,3,null,0,null,3,null],[8,null,7,null,3,null,0,null],[7,null,10,null,14,null,12,null],[14,null,12,null,10,null,5,7]],"leadType":"sine","leadVol":0.07,"leadLen":1.8};
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
const PENTA = [0, 3, 5, 7, 10];
// chord kinds: major, minor, diminished, augmented, sus2, sus4, 7, m7, maj7, sus2 flat 5 (a song's chords are [root, kind])
const CQ = { M: [0, 4, 7], m: [0, 3, 7], d: [0, 3, 6], a: [0, 4, 8], s2: [0, 2, 7], s4: [0, 5, 7], '7': [0, 4, 7, 10], m7: [0, 3, 7, 10], M7: [0, 4, 7, 11], x: [0, 2, 6] };
const cq = q => CQ[q] || CQ.M;
const note = (i, oct = SONG.sfxOct) => mtof(SONG.root + 12 * oct + 12 * Math.floor(i / 5) + PENTA[((i % 5) + 5) % 5]);
// Smooth voice leading: of every inversion/octave of the chord inside [lo, hi], pick the one closest to the last voicing.
function voiceLead(prev, pcs, lo, hi){
  const n = pcs.length, pc = m => ((m % 12) + 12) % 12; let best = null, bs = Infinity;
  for (let inv = 0; inv < n; inv++) {
    const ord = pcs.slice(inv).concat(pcs.slice(0, inv));
    for (let b = lo; b <= hi; b++) {
      if (pc(b) !== pc(ord[0])) continue;
      const v = [b]; for (let i = 1; i < n; i++) { let m = v[i - 1] + 1; while (pc(m) !== pc(ord[i])) m++; v.push(m); }
      if (v[n - 1] > hi) break;
      let s = 0;
      if (prev && prev.length) { for (const x of v) s += Math.min(...prev.map(p => Math.abs(p - x))); for (const p of prev) s += 0.5 * Math.min(...v.map(x => Math.abs(p - x))); }
      else s = Math.abs((v[0] + v[n - 1]) / 2 - (lo + hi) / 2);
      if (s < bs) { bs = s; best = v; }
    }
  }
  if (best) return best;
  let b = lo; while (pc(b) !== pc(pcs[0])) b++; const v = [b]; for (let i = 1; i < n; i++) { let m = v[i - 1] + 1; while (pc(m) !== pc(pcs[i])) m++; v.push(m); } return v;
}
const Music = (() => {
  let timer = null, step = 0, next = 0, bus = null, c = null, level = 0, t0 = null, clockT0 = null;
  const eighth = () => 60 / SONG.bpm / 2;
  // Every chord of the loop is voiced once per song as the inversion nearest the chord before it (the last chord leads
  // into the first), so the pad and the arpeggio glide between chords instead of jumping; the bass keeps each root underneath.
  let voiced = null, voicedFor = null;
  function voicings(){
    if (voicedFor === SONG && voiced) return voiced;
    const R = SONG.root; let prev = null, out = [];
    for (let pass = 0; pass < 3; pass++) { out = []; for (const [r, q] of SONG.chords) { prev = voiceLead(prev, cq(q).map(x => R + r + x), 53, 72); out.push(prev); } }
    voicedFor = SONG; voiced = out; return out;
  }
  // the bass steps into the tonic on the last eighth before it: the leading tone if the chord has it,
  // otherwise a step that belongs to the chord, otherwise a step that doesn't rub against it
  function approach(chord, tonicBass){
    const [r, q] = chord, pcOf = m => ((m % 12) + 12) % 12, pcs = cq(q).map(x => pcOf(SONG.root + r + x));
    if (pcs.includes(pcOf(tonicBass - 1))) return tonicBass - 1;
    for (const d of [2, -2]) if (pcs.includes(pcOf(tonicBass + d))) return tonicBass + d;
    const rub = m => pcs.some(p => Math.min((pcOf(m) - p + 12) % 12, (p - pcOf(m) + 12) % 12) === 1);
    return rub(tonicBass + 2) ? tonicBass - 2 : tonicBass + 2;
  }
  function v(cx, dest, freq, t, dur, type, vol, atk = 0.008){
    const o = cx.createOscillator(), g = cx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + atk);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(dest); o.start(t); o.stop(t + dur + 0.05);
  }
  const hatBufs = new WeakMap();   // one noise burst per audio context, reused by every hat
  function hat(cx, dest, t, vol){
    let buf = hatBufs.get(cx);
    if (!buf) { const n = Math.floor(cx.sampleRate * 0.04); buf = cx.createBuffer(1, n, cx.sampleRate); const d = buf.getChannelData(0); for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n); hatBufs.set(cx, buf); }
    const s = cx.createBufferSource(), f = cx.createBiquadFilter(), g = cx.createGain();
    f.type = 'highpass'; f.frequency.value = 6000; g.gain.value = vol; s.buffer = buf;
    s.connect(f).connect(g).connect(dest); s.start(t);
  }
  function sched(cx, dest, s, t, lvl){
    const L = SONG.barLen || 8, e = eighth(), n = SONG.chords.length, bar = Math.floor(s / L) % n, b = s % L;
    const [r, q] = SONG.chords[bar], rr = r > 6 ? r - 12 : r, R = SONG.root, V = voicings()[bar];
    if (b === 0) for (const m of V) v(cx, dest, mtof(m), t, e * L, 'sine', SONG.padVol, 0.3);
    // bass: the chord's root on the downbeat, in one steady register (fifths and octaves only off the beat);
    // on the last eighth before the tonic chord it steps into the tonic
    const TQ = SONG.tonicQ || 'm', nx = SONG.chords[(bar + 1) % n], intoTonic = b === L - 1 && n > 1 && !(r === 0 && q === TQ) && nx[0] === 0 && nx[1] === TQ;
    const bs = SONG.bass[b];
    if (intoTonic) v(cx, dest, mtof(approach(SONG.chords[bar], R + 12 * SONG.bassOct)), t, e * 0.9, SONG.bassType, SONG.bassVol * 0.85);
    else if (bs !== null) v(cx, dest, mtof(R + 12 * SONG.bassOct + rr + (bs === 7 ? cq(q)[2] : bs)), t, e * SONG.bassLen, SONG.bassType, SONG.bassVol);
    const a = SONG.arp[b];     // the arpeggio walks the voiced chord an octave up (3 = its lowest note an octave higher)
    if (a !== null) v(cx, dest, mtof((a < 3 ? V[a] : V[0] + 12) + 12), t, e * 1.4, SONG.arpType, SONG.arpVol);
    const m = SONG.lead[bar][b];
    if (m !== null) v(cx, dest, mtof(R + 12 + m), t, e * SONG.leadLen, SONG.leadType, SONG.leadVol, 0.01);
    if (lvl >= 1 && b % 2 === 1) hat(cx, dest, t, 0.04);
    if (lvl >= 2 && b % 2 === 0) hat(cx, dest, t, 0.025);
  }
  function tick(){ if (!c || !bus) return; while (next < c.currentTime + 0.15) { sched(c, bus, step, next, level); step++; next += eighth(); } }
  return {
    start(){
      c = Sfx.ctx(); this.stop(0.05);
      if (!c) { clockT0 = performance.now() / 1000 + 0.06; t0 = clockT0; return; }
      bus = c.createGain(); bus.gain.value = muted ? 0 : SONG.vol; bus.connect(c.destination);
      step = 0; level = 0; next = c.currentTime + 0.06; t0 = next; timer = setInterval(tick, 30); tick();
    },
    stop(fade = 0.5){
      if (timer) { clearInterval(timer); timer = null; }
      const b = bus; bus = null;
      if (b && c) { b.gain.setTargetAtTime(0, c.currentTime, fade / 4); setTimeout(() => { try { b.disconnect(); } catch (e) {} }, fade * 1000 + 400); }
    },
    setLevel(l){ level = l; },
    mute(m){ if (bus) bus.gain.value = m ? 0 : SONG.vol; },

const Scene = (() => {
  const PW = 160, DEFAULT_SET = ['dawn', 'synth', 'vapor', 'city', 'gameboy', 'desert', 'space', 'ocean'];
  let cur = null, prev = null, fade = 1, key = '', runSeed = 1;
  const rngOf = a => () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const set = () => (Game.sceneSet || DEFAULT_SET).filter(id => SceneArt[id]);
  function render(idx, prog){
    const w = PW, h = Math.max(60, Math.round(PW * H / Math.max(1, W))), ids = set();
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    const g = c.getContext('2d'), cycle = Math.floor(idx / ids.length);
    SceneArt[ids[idx % ids.length]].draw(g, w, h, rngOf(runSeed + idx * 7919), prog);
    if (cycle > 0 && 'filter' in g) {   // later laps: same scenes, new colors
      const c2 = document.createElement('canvas'); c2.width = w; c2.height = h; const g2 = c2.getContext('2d');
      g2.filter = `hue-rotate(${(cycle * 55) % 360}deg) saturate(1.15)`; g2.drawImage(c, 0, 0); return c2;
    }
    return c;
  }
  return {
    newRun(){ runSeed = Math.floor(Math.random() * 1e9); key = ''; },
    name(score){ const st = Game.sceneStep || 10, ids = set(); return SceneArt[ids[Math.floor(score / st) % ids.length]].name; },
    draw(c, k, score){
      const st = Game.sceneStep || 10, idx = Math.floor(score / st), prog = (score % st) / st;
      const nk = idx + ':' + Math.round(prog * 10) + ':' + W + 'x' + H;
      if (nk !== key) {
        const sceneChanged = !key || key.split(':')[0] !== String(idx);
        prev = cur; cur = render(idx, prog); fade = prev ? (sceneChanged ? 0 : 0.6) : 1; key = nk;
      }
      c.imageSmoothingEnabled = false;
      if (prev && fade < 1) { c.drawImage(prev, 0, 0, W, H); c.globalAlpha = fade; fade = Math.min(1, fade + 0.025 * k); }

})();

      const x = W * (0.25 + 0.5 * i + 0.15 * Math.sin(t * 0.4 + i * 2)), y = H * (0.12 + 0.05 * Math.cos(t * 0.5 + i));

  let planets = [], cur = null, pl = null, trail = [], stars = [], orbs = [], trailAcc = 0;
  const R = p => p.r + 16 * sc();
  const capR = p => (p.r + 18 * sc()) * (K.has('magnet') ? 1.9 : 1) * (0.55 + 0.45 * K.diff.tol);

  function mk(prev, i){
    const s = sc();
    if (!prev) return { x: K.W / 2, y: K.H * 0.72, r: 30 * s, spd: 0.032 * K.diff.speed, i, hue: 200, rot: 0 };
    const r = Math.max(15, 30 - i * 0.3) * rnd(0.85, 1.15) * s;
    const gap = Math.min(150 + i * 2, 205) * rnd(0.92, 1.08) * s;
    let x = prev.x + rnd(-1, 1) * K.W * 0.32;
    x = Math.min(K.W * 0.8, Math.max(K.W * 0.2, x));
    const dir = Math.random() < 0.5 ? -1 : 1;
    const spd = Math.min(0.032 + i * 0.001, 0.06) * dir * rnd(0.9, 1.1) * K.diff.speed;
    return { x, y: prev.y - gap, r, spd, i, hue: (200 + i * 29) % 360, rot: 0 };
  }
  function ensure(){
    while (planets[planets.length - 1].y + K.cam > -260) {
      const last = planets[planets.length - 1], nx = mk(last, last.i + 1); planets.push(nx);
      if (last.i >= 2 && Math.random() < 0.3) orbs.push({ x: (last.x + nx.x) / 2 + rnd(-12, 12) * sc(), y: (last.y + nx.y) / 2, type: K.randomPower() });
    }
    planets = planets.filter(p => p.y + K.cam < K.H + 200 || p === cur);
    orbs = orbs.filter(o => o.y + K.cam < K.H + 100);
  }
  function playerPos(){
    if (pl.mode === 'orbit') return { x: cur.x + Math.cos(pl.a) * pl.rr, y: cur.y + Math.sin(pl.a) * pl.rr };
    return { x: pl.x, y: pl.y };
  }
  function capture(q){
    const v = Math.hypot(pl.vx, pl.vy);
    const off = Math.abs(pl.vx * (q.y - pl.y) - pl.vy * (q.x - pl.x)) / v;
    const perfect = off < q.r * 0.45;
    const gained = q.i - cur.i;
    cur = q;
    pl = { mode: 'orbit', a: Math.atan2(pl.y - q.y, pl.x - q.x), rr: Math.hypot(pl.x - q.x, pl.y - q.y) };
    K.add(gained + (perfect ? 1 : 0));
    const f = K.note(Math.min(K.score, 14));
    K.tone(f, 0.14, 'sine', 0.14); K.tone(f * 1.5, 0.18, 'sine', 0.06, null, 0.03); K.buzz(perfect ? [15, 30, 15] : 18);
    K.burst(q.x, q.y - q.r, `hsl(${q.hue} 80% 70%)`, perfect ? 22 : 10);
    if (perfect) { K.float('Bullseye +1', '#ffd166', 22); K.flash(0.8); }
    if (gained > 1) K.float(`Skip! +${gained}`, '#4dd4ac', 22, K.H * 0.46);
  }

  return {
    reset(){
      planets = [mk(null, 0)]; cur = planets[0];
      pl = { mode: 'orbit', a: -Math.PI / 2 + 0.4, rr: R(cur) };
      trail = []; orbs = []; K.cam = 0; ensure();
      if (!stars.length) stars = Array.from({ length: 90 }, () => ({ x: Math.random(), y: Math.random(), s: Math.random() < 0.15 ? 2 : 1, z: rnd(0.08, 0.45) }));
    },
    resize(){ if (cur) ensure(); },
    revive(){ pl = { mode: 'orbit', a: -Math.PI / 2, rr: R(cur) }; trail = []; },
    rescue(){ pl = { mode: 'orbit', a: -Math.PI / 2, rr: R(cur) }; trail = []; },
    fx: true, difficulty: true, sceneSet: ['nebula', 'galaxy', 'space', 'comets', 'aurora', 'blackhole'],
    powerPool: ['magnet', 'aim'],
    extraPowers: {
      magnet: { label: 'Magnet', color: '#ff5d8f', dur: 8, icon: 'magnet' },
      aim: { label: 'Aim guide', color: '#4dd4ac', dur: 10, icon: 'aim' }
    },
    tap(){
      if (pl.mode !== 'orbit') return;
      const dir = Math.sign(cur.spd), v = 10 * sc();
      const p = playerPos();
      pl = { mode: 'fly', x: p.x, y: p.y, vx: -Math.sin(pl.a) * dir * v, vy: Math.cos(pl.a) * dir * v, d: 0 };
      K.tone(300, 0.08, 'square', 0.05, 640); K.buzz(8);
    },
    update(k, st){
      for (const p of planets) p.rot += p.spd * k;
      if (pl.mode === 'orbit') {
        pl.a += cur.spd * k;
        pl.rr += (R(cur) - pl.rr) * (1 - Math.pow(0.8, k));
      } else {
        const n = 3;
        for (let s = 0; s < n; s++) {
          pl.x += pl.vx * k / n; pl.y += pl.vy * k / n; pl.d += Math.hypot(pl.vx, pl.vy) * k / n;
          if (pl.mode === 'fly') {
            for (const q of planets) {
              if (q.i <= cur.i) continue;
              if (Math.hypot(pl.x - q.x, pl.y - q.y) < capR(q)) { capture(q); break; }
            }
            if (pl.mode !== 'fly') break;
            for (const o of orbs) if (!o.taken && Math.hypot(pl.x - o.x, pl.y - o.y) < 20 * sc()) { o.taken = true; K.grant(o.type, o.x, o.y); }
          }
        }
        if (pl.mode === 'fly' && st === 'play') {
          const sy = pl.y + K.cam;
          const ahead = planets.filter(q => q.i > cur.i && q.i <= cur.i + 3);
          const leaving = ahead.every(q => (q.x - pl.x) * pl.vx + (q.y - pl.y) * pl.vy < 0);
          if (leaving || pl.x < -40 || pl.x > K.W + 40 || sy < -60 || sy > K.H + 60 || pl.d > K.H * 1.3) { pl.mode = 'lost'; K.lose(); }
        }
      }
      const p = playerPos();
      trailAcc += k;   // one trail dot per 60 Hz frame, so the trail is as long on 90/120 Hz screens
      if (trailAcc >= 1) { trailAcc -= Math.floor(trailAcc); trail.push(p); if (trail.length > (K.tier >= 3 ? 40 : 18)) trail.shift(); }
      const target = K.H * 0.72 - cur.y;
      K.cam += (target - K.cam) * (1 - Math.pow(0.92, k));
      ensure();
    },
    bg(ctx){
      const h = (235 + Math.floor(K.score / 10) * 40) % 360;
      const g = ctx.createLinearGradient(0, 0, 0, K.H);
      g.addColorStop(0, `hsl(${h} 50% 9%)`); g.addColorStop(1, `hsl(${(h + 30) % 360} 45% 15%)`);
      ctx.globalAlpha = K.sceneDim(0.62); ctx.fillStyle = g; ctx.fillRect(0, 0, K.W, K.H); ctx.globalAlpha = 1;
      ctx.fillStyle = 'rgba(255,255,255,.55)';
      for (const s of stars) {
        const y = ((s.y * K.H + K.cam * s.z) % K.H + K.H) % K.H;
        ctx.globalAlpha = 0.3 + s.z; ctx.fillRect(s.x * K.W, y, s.s, s.s);
      }
      ctx.globalAlpha = 1;
    },
    draw(ctx){
      // orbit path of the current planet
      ctx.setLineDash([3, 7]); ctx.lineWidth = 1.5; ctx.strokeStyle = 'rgba(255,255,255,.2)';
      ctx.beginPath(); ctx.arc(cur.x, cur.y, R(cur), 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);
      for (const p of planets) {
        ctx.fillStyle = `hsla(${p.hue} 80% 60% / .1)`;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r * 1.75, 0, Math.PI * 2); ctx.fill();
        if (K.tier >= 2) { K.glow(ctx, `hsl(${p.hue} 90% 60%)`, 26); }
        ctx.fillStyle = `hsl(${p.hue} 62% 52%)`;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill(); ctx.shadowBlur = 0;
        ctx.fillStyle = `hsl(${p.hue} 62% 40%)`;
        for (let c = 0; c < 3; c++) {
          const a = p.rot + c * 2.1, d = p.r * (0.35 + c * 0.12);
          ctx.beginPath(); ctx.arc(p.x + Math.cos(a) * d, p.y + Math.sin(a) * d, p.r * (0.16 - c * 0.03), 0, Math.PI * 2); ctx.fill();
        }
        ctx.fillStyle = `hsla(${p.hue} 90% 85% / .35)`;
        ctx.beginPath(); ctx.arc(p.x - p.r * 0.35, p.y - p.r * 0.35, p.r * 0.32, 0, Math.PI * 2); ctx.fill();
        if (K.tier >= 4 && p.i % 2 === 0) {
          ctx.strokeStyle = `hsla(${(p.hue + 40) % 360} 90% 75% / .7)`; ctx.lineWidth = 3;
          ctx.beginPath(); ctx.ellipse(p.x, p.y, p.r * 1.8, p.r * 0.5, -0.4 + p.rot * 0.05, 0, Math.PI * 2); ctx.stroke();
        }
      }
      for (const o of orbs) if (!o.taken) K.drawPower(ctx, o.type, o.x, o.y, 12 * sc());
      if (K.has('magnet')) {
        const q = planets.find(x => x.i === cur.i + 1);
        if (q) { ctx.strokeStyle = 'rgba(255,93,143,.35)'; ctx.setLineDash([6, 6]); ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(q.x, q.y, capR(q), 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]); }
      }
      const p = playerPos();
      if (pl.mode === 'orbit' && (K.score < 2 || K.has('aim')) && K.state === 'play') {
        const len = K.has('aim') ? 300 : 90;
        const dir = Math.sign(cur.spd), tx = -Math.sin(pl.a) * dir, ty = Math.cos(pl.a) * dir;
        ctx.setLineDash([4, 6]); ctx.strokeStyle = 'rgba(77,212,172,.6)'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x + tx * len * sc(), p.y + ty * len * sc()); ctx.stroke(); ctx.setLineDash([]);
      }
      trail.forEach((t, i) => {
        ctx.globalAlpha = (i / trail.length) * (K.tier >= 3 ? 0.7 : 0.5); ctx.fillStyle = K.tier >= 5 ? K.rainbow(i * 9) : K.tier >= 3 ? `hsl(${160 + i * 3} 75% 60%)` : '#4dd4ac';
        ctx.beginPath(); ctx.arc(t.x, t.y, 2 + (i / trail.length) * 4 * sc(), 0, Math.PI * 2); ctx.fill();
      });
      ctx.globalAlpha = 1;
      K.glow(ctx, K.tier >= 5 ? K.rainbow() : '#4dd4ac', K.tier >= 2 ? 26 : 16); ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.arc(p.x, p.y, 7 * sc(), 0, Math.PI * 2); ctx.fill(); ctx.shadowBlur = 0;
    },
    peek(){ return { planets, cur, pl }; }
  };
})();


function renderDiff(){
  if (!Game.difficulty) return;
  for (const id of ['diffBox', 'diffBox2']) {
    const box = $(id); if (!box) continue; box.hidden = false; box.innerHTML = '';
    for (const [k, d] of Object.entries(DIFFS)) {
      const b = document.createElement('button'); b.className = 'chip'; b.textContent = d.name; b.setAttribute('aria-pressed', String(k === diffKey));
      b.addEventListener('click', () => setDiff(k)); box.appendChild(b);
    }
  }
}
function setDiff(k){
  diffKey = k; try { localStorage.setItem('arcade_diff', k); } catch (e) {}
  best = store.get(bestKey(), 0); $('best').textContent = best; $('sBest').textContent = best; renderDiff();
}

function gameOver(){
  state = 'over'; games++;
  if (Game.onGameOver) Game.onGameOver(score);
  const prevBest = best, nb = score > best; if (nb) best = score;
  store.set(Game.difficulty ? bestKey() : 'best', best); store.set('games', games);
  $('best').textContent = best; $('final').textContent = score; $('oGames').textContent = games;
  const on = Game.difficulty ? ' on ' + DIFFS[diffKey].name : '';
  $('bestLine').innerHTML = nb && score > 0 ? '<span class="pill">New best' + on + '!</span>'
    : score === prevBest && score > 0 ? 'Tied your best' + on + '!'
    : prevBest > 0 ? (prevBest - score + 1) + ' more to beat your best' + on + ' (' + prevBest + ')' : 'Best ' + best;
  renderDiff();
  $('share').textContent = 'Copy score';
  $('over').hidden = false; overTapAt = performance.now() + 700;
}
function start(){
  Sfx.unlock();
  $('start').hidden = true; $('over').hidden = true; $('pause').hidden = true; hideContinue();
  usedContinue = false; newBestShown = false; sceneShown = 0; Scene.newRun(); score = 0; powers = {}; tierShown = 0; renderPowers(); $('score').textContent = 0; parts = []; floats = []; shake = 0; flash = 0; K.cam = 0;
  Game.reset(); state = 'play'; lastT = 0;
  Music.start();
}
function resume(){ $('pause').hidden = true; state = 'play'; lastT = 0; Music.start(); Music.setLevel(Math.min(2, Math.floor(score / 10))); }
function playAgain(){ start(); }
$('play').addEventListener('click', start);
$('pauseBtn').addEventListener('click', () => { if (state === 'play') { state = 'paused'; $('pause').hidden = false; Music.stop(0.1); } else if (state === 'paused') resume(); });
$('again').addEventListener('click', playAgain);
$('share').addEventListener('click', async e => {
  const text = KQI18n.t('I scored ' + score + ' in Orbit Hop. Beat that.');
  try { await navigator.clipboard.writeText(text); e.target.textContent = 'Copied!'; } catch (err) { e.target.textContent = text; }
});
function setMute(m){ muted = m; store.set('muted', m); $('icoOn').hidden = m; $('icoOff').hidden = !m; Music.mute(m); }
$('mute').addEventListener('click', () => setMute(!muted)); setMute(muted);

function press(x, y){
  if (state === 'play') Game.tap(x, y);
  else if (state === 'idle') start();
  else if (state === 'paused') resume();
  else if (state === 'over' && performance.now() > overTapAt) playAgain();
}
addEventListener('pointerdown', e => {
  if (e.target.closest('button,a') || e.target.closest('#cont') || e.target.closest('[data-noautostart]')) return;
  if (state === 'play') e.preventDefault();
  press(e.clientX, e.clientY);
}, { passive: false });
addEventListener('keydown', e => {
  if (e.target && e.target.closest && e.target.closest('input,textarea,select,[data-ownkeys]')) return;   // typing a tune code or a name, or a panel that handles its own keys
  if (ready && Game.onKey && Game.onKey(e)) { e.preventDefault(); return; }
  const map = { Space: W / 2 + 1, Enter: W / 2 + 1, ArrowLeft: 1, ArrowRight: W - 1 };
  if (!(e.code in map)) return;
  e.preventDefault(); press(map[e.code], H / 2);
});
document.addEventListener('visibilitychange', () => {
  if (document.hidden && state === 'play') { state = 'paused'; $('pause').hidden = false; Music.stop(0.1); }
  if (document.hidden) Sfx.sleep();
});
// Android back button (ads.js): pause a run first, then back to the menu
window.onBackButton = () => {
  if (Game.onBack && Game.onBack()) return true;   // a panel of the game's own (Chordfall's tune card) closes first
  if (state === 'play') { state = 'paused'; $('pause').hidden = false; Music.stop(0.1); buzz('select'); return true; }
  if (state === 'continue') { declineContinue(); return true; }
  return false;
};

function frame(ts){
  requestAnimationFrame(frame);
  const dt = lastT ? Math.min(50, ts - lastT) : 16.7; lastT = ts;
  const k = dt / 16.7;
  const FX = Game.fx === true;
  if (state !== 'paused' && ts > 1500 && !restedLast) {   // drop graphics quality if this phone can't keep up (menus count too, frames that drew nothing don't)
    ema = ema * 0.95 + dt * 0.05;
    slowFrames = ema > 21 ? slowFrames + (ema > 28 ? 2 : 1) * k : Math.max(0, slowFrames - 2 * k);   // clearly slow phones step down twice as fast (counted in 60 Hz frames of real time)
    if (slowFrames > 90 && quality > 0) { quality--; slowFrames = 0; downgraded = true; ema = 16.7; try { localStorage.setItem('arcade_quality', quality); } catch (e) {} resize(); }
    fastFrames = ema < 17.5 ? fastFrames + k : 0;   // a phone that was slow last time but runs smoothly now gets full effects back (counted in 60 Hz frames)
    if (!downgraded && fastFrames > 900 && quality < 2) { quality++; fastFrames = 0; try { localStorage.setItem('arcade_quality', quality); } catch (e) {} resize(); }
  }
  // menus and pause show a still picture: draw it once, then leave the canvas alone until something moves
  const still = (state === 'idle' || state === 'paused') && !parts.length && !floats.length && flash <= 0 && shake <= 0;
  const sig = state + ':' + W + 'x' + H + ':' + quality + ':' + score;
  restedLast = still && sig === lastSig;
  if (restedLast) return;
  lastSig = still ? sig : '';
  if (state === 'play') tickPowers(dt / 1000);
  const gk = state === 'play' && powers.slow ? k * 0.55 : k;
  if (state === 'play' || state === 'falling' || state === 'over' || state === 'continue') Game.update(gk, state);
  if (FX && state === 'play' && K.tier > tierShown) { tierShown = K.tier; K.float('New look: ' + LOOKS[tierShown], '#f2f0ff', 20, H * 0.26); }
  if (scenesOn() && state === 'play') { const si = Math.floor(score / (Game.sceneStep || 10)); if (si > sceneShown) { sceneShown = si; K.float(Scene.name(score), '#bff6ff', 16, H * 0.12); } }
  if (scenesOn()) Scene.draw(ctx, k, score);
  Game.bg(ctx);
  if (Game.fx === true) drawLooks(ctx, k);
  if (powers.slow && state === 'play') { ctx.fillStyle = 'rgba(165,148,255,.08)'; ctx.fillRect(0, 0, W, H); }
  if (shake > 0) { shake *= Math.pow(0.82, k); if (shake < 0.3) shake = 0; }
  const sx = shake ? (Math.random() - .5) * shake : 0, sy = shake ? (Math.random() - .5) * shake : 0;
  ctx.save(); ctx.translate(sx, K.cam + sy);
  Game.draw(ctx);
  for (const p of parts) {
    p.x += p.vx * k; p.y += p.vy * k + 0.08 * k * k; p.vy += 0.16 * k; p.life -= 0.03 * k;
    ctx.globalAlpha = Math.max(0, p.life); ctx.fillStyle = p.color; ctx.fillRect(p.x, p.y, p.s, p.s);
  }
  ctx.globalAlpha = 1; parts = parts.filter(p => p.life > 0);
  ctx.restore();
  if (flash > 0) { ctx.fillStyle = 'rgba(' + flashColor + ',' + (flash * 0.2) + ')'; ctx.fillRect(0, 0, W, H); flash -= 0.07 * k; }
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const f of floats) {
    f.life -= 0.02 * k; f.y -= 0.6 * k;
    ctx.globalAlpha = Math.max(0, Math.min(1, f.life * 2)); ctx.fillStyle = f.color;
    ctx.font = '700 ' + f.size + 'px Rubik, system-ui, sans-serif'; ctx.fillText(f.text, W / 2, f.y);
  }
  ctx.globalAlpha = 1; floats = floats.filter(f => f.life > 0);
}

if (Game.extraPowers) Object.assign(POWERS, Game.extraPowers);
Scene.newRun();
if (Game.difficulty) best = store.get(bestKey(), 0);
renderDiff();
resize(); ready = true; Game.reset();
$('best').textContent = best;
if (games > 0) { $('startStats').hidden = false; $('sBest').textContent = best; $('sGames').textContent = games; }
requestAnimationFrame(frame);
window.Proto = { start, Game, K, Music, POWERS, setDiff, Scene, get quality(){ return quality; }, get powers(){ return powers; }, get SONG(){ return SONG; }, get state(){ return state; } };
})();
</script>
</body>
</html>
