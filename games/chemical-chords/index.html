<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script src="../../shared/web-audio-unlock.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b1020">
<meta name="description" content="Mix real chemicals, watch them react, and hear the music hidden in their light. Every element's spectral lines, shifted down 40 octaves.">
<title>Chemical Chords</title>
<link rel="stylesheet" href="style.css">
<script src="../../shared/kq-i18n/kq-i18n.js"></script>
<script src="i18n.js"></script>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand"><span class="logo" aria-hidden="true"></span><h1>Chemical <b>Chords</b></h1></div>
    <div class="stats">
      <button id="bCodex" class="pill" aria-label="Codex: reactions discovered"><span class="flask" aria-hidden="true"></span><b id="discN">0</b><small>/<span id="discT">0</span></small></button>
      <span class="pill coins" title="Coins (shared by all Known Quantity games)"><span class="coin" aria-hidden="true"></span><b id="coinN">0</b></span>
      <button id="bLearn" class="pill" aria-label="Learn"><span class="wide">Learn</span><span class="narrow" aria-hidden="true">?</span></button>
      <select data-kq-lang="short" aria-label="Language"></select>
      <button id="bMute" class="pill icon" aria-label="Sound on or off" aria-pressed="false">♪</button>
    </div>
  </header>

  <main id="stage">
    <canvas id="lab" aria-label="Lab bench with a beaker"></canvas>
    <div id="contents" aria-live="polite"></div>
    <div class="mode" role="radiogroup" aria-label="What you hear">
      <button id="mNatural" role="radio" aria-checked="true">Natural</button>
      <button id="mTuned" role="radio" aria-checked="false">Tuned</button>
    </div>
    <div class="actions">
      <button id="bHeat" class="act heat"><span aria-hidden="true">🔥</span> Heat</button>
      <button id="bListen" class="act listen"><span aria-hidden="true">♪</span> Listen</button>
      <button id="bEmpty" class="act">Empty</button>
    </div>
    <div id="toast" role="status"></div>
  </main>

  <button id="specbar" aria-label="Open the sound breakdown">
    <canvas id="spec"></canvas>
    <span id="specLabel">Add something to the beaker</span>
  </button>

  <nav id="shelf" aria-label="Chemical shelf">
    <div class="tabs" role="tablist"></div>
    <div id="bottles" role="list"></div>
  </nav>
</div>

<div id="scrim" class="hidden"></div>

<section id="sheet" class="sheet hidden" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <button class="close" data-close aria-label="Close">×</button>
  <div id="sheetBody"></div>
</section>

<script src="../../shared/kq-profile/kq-profile.js"></script>
<script src="tunecode.js"></script>
<script src="data.js"></script>
<script src="music.js"></script>
<script src="fx.js"></script>
<script src="game.js"></script>
</body>
</html>
