<!doctype html>
<html lang="en">

<style>
/* Layout: one full-screen canvas toy; a slim top bar (menu, name, music, sound, vibration); action pills along the bottom. Single cozy dark look by choice. */
:root{
  --bg:#121019; --fg:#f4f0ff; --muted:#a39dbf; --accent:#8fb7ff; --ink:#17121f; --bar:rgba(24,20,34,.88); --line:rgba(255,255,255,.12);
  --display:'Rubik Mono One',Impact,'Arial Black',sans-serif; --body:'Rubik',system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--fg);font-family:var(--body);
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;overscroll-behavior:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.top{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;gap:8px;z-index:3;pointer-events:none;
  padding-top:calc(env(safe-area-inset-top,0px) + 10px);padding-bottom:6px;
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.top>*{pointer-events:auto}
.title{flex:1;min-width:0;font-family:var(--display);font-size:13px;letter-spacing:-.02em;color:var(--accent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 2px 0 rgba(0,0,0,.35);pointer-events:none}
.ib{flex:none;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--bar);color:var(--fg);display:grid;place-items:center;cursor:pointer;padding:0;text-decoration:none;box-sizing:border-box}
.ib svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ib.off{opacity:.42}
.ib.off .on-only{display:none}
.ib:not(.off) .off-only{display:none}
.bottom{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:10px;z-index:3;pointer-events:none;
  padding-bottom:calc(env(safe-area-inset-bottom,0px) + 14px);padding-top:6px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bottom>*{pointer-events:auto}
.pill{font:600 14px var(--body);color:var(--ink);background:var(--accent);border:0;border-radius:999px;padding:11px 18px;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.35);white-space:nowrap}
.pill.ghost{background:var(--bar);color:var(--fg);box-shadow:none;border:1px solid var(--line)}
.pill:active{transform:translateY(2px)}
.pill.pulse{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.07)}}
.ib:focus-visible,.pill:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.hint{position:fixed;left:0;right:0;z-index:2;text-align:center;font-size:14px;color:var(--fg);opacity:.75;pointer-events:none;transition:opacity .8s;
  top:calc(env(safe-area-inset-top,0px) + 64px);padding-inline:24px;text-shadow:0 1px 4px rgba(0,0,0,.6)}
.hint.gone{opacity:0}
.toast{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);z-index:4;font:700 18px var(--body);color:var(--fg);background:var(--bar);border:1px solid var(--line);
  border-radius:999px;padding:10px 18px;pointer-events:none;animation:toast 1.8s ease forwards;white-space:nowrap}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-30%)}12%{opacity:1;transform:translate(-50%,-50%)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-70%)}}
@media (prefers-reduced-motion:reduce){.pill.pulse{animation:none}.toast{animation:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="top">
  <a class="ib" id="home" href="index.html" aria-label="Back to menu" title="Menu"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></a>
  <div class="title">Rainy Window</div>
  <button class="ib" id="musicBtn" aria-label="Music" title="Music"><svg viewBox="0 0 24 24"><path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/><path class="off-only" d="M3 3l18 18"/></svg></button>
  <button class="ib" id="soundBtn" aria-label="Sound" title="Sound"><svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path class="on-only" d="M16 9a4 4 0 0 1 0 6"/><path class="on-only" d="M18.5 6.5a8 8 0 0 1 0 11"/><path class="off-only" d="M16 9l5 6M21 9l-5 6"/></svg></button>
  <button class="ib" id="hapticBtn" aria-label="Vibration" title="Vibration"><svg viewBox="0 0 24 24"><rect x="8" y="4" width="8" height="16" rx="2"/><path class="on-only" d="M4 9v6M20 9v6"/><path class="off-only" d="M3 3l18 18"/></svg></button>
</div>
<div class="hint" id="hint">Wipe the fog off the glass</div>
<div class="bottom" id="actions"></div>
<script>
(() => {
'use strict';
if (!CanvasRenderingContext2D.prototype.roundRect) CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r){
  r = Math.min(typeof r === 'number' ? r : 0, w / 2, h / 2); this.moveTo(x + r, y); this.arcTo(x + w, y, x + w, y + h, r); this.arcTo(x + w, y + h, x, y + h, r); this.arcTo(x, y + h, x, y, r); this.arcTo(x, y, x + w, y, r); this.closePath(); };
const $ = id => document.getElementById(id);
const cv = $('c'), ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1, ready = false, dirty = true;   // dirty: redraw on the next frame even if the toy is at rest
const store = {
  get(k, d){ try { const v = localStorage.getItem('calm_' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v){ try { localStorage.setItem('calm_' + k, JSON.stringify(v)); } catch (e) {} }
};
let soundOn = store.get('sound', true), musicOn = store.get('music', true), hapticsOn = store.get('haptics', true);

// ---------- audio: everything is synthesized, nothing is loaded ----------
let ac = null, sfxBus = null, musicBus = null, noiseBuf = null;
function audio(){
  try {
    if (!ac) {
      ac = new (window.AudioContext || window.webkitAudioContext)();
      if (window.Ads && Ads.trackAudio) Ads.trackAudio(ac);
      const master = ac.createGain(); master.connect(ac.destination);
      sfxBus = ac.createGain(); sfxBus.gain.value = soundOn ? 1 : 0; sfxBus.connect(master);
      musicBus = ac.createGain(); musicBus.gain.value = soundOn && musicOn ? 1 : 0; musicBus.connect(master);
    }
    if (ac.state === 'suspended' && !document.hidden && !(window.Ads && Ads.showing)) ac.resume();
    return ac;
  } catch (e) { return null; }
}
function noise(){
  if (noiseBuf) return noiseBuf;
  const n = ac.sampleRate * 2; noiseBuf = ac.createBuffer(1, n, ac.sampleRate);
  const d = noiseBuf.getChannelData(0); for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
  return noiseBuf;
}
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
let lastBuzz = 0;
const C = {
  ctx, get W(){ return W; }, get H(){ return H; }, get DPR(){ return DPR; },
  top: 60, bottom: 70,
  get soundOn(){ return soundOn; }, get hapticsOn(){ return hapticsOn; },
  mtof, audio,
  tone(f, dur, type = 'sine', vol = 0.1, slideTo = null, delay = 0, music = false){

  },
  noise(dur, vol = 0.1, type = 'bandpass', freq = 2000, Q = 1, delay = 0, freqTo = null){
    if (!soundOn) return; const c = audio(); if (!c) return;
    const t = c.currentTime + delay, s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    s.buffer = noise(); f.type = type; f.frequency.setValueAtTime(freq, t); if (freqTo) f.frequency.exponentialRampToValueAtTime(freqTo, t + dur); f.Q.value = Q;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.003); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);

  },
  // A continuous noise texture (sand, squelch, rain) whose loudness and brightness the toy steers every frame.
  texture(o){
    let n = null;
    const make = () => {
      if (n) return n; const c = audio(); if (!c) return null;
      const s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
      s.buffer = noise(); s.loop = true; f.type = o.type || 'lowpass'; f.frequency.value = o.freq || 800; f.Q.value = o.Q || 0.7; g.gain.value = 0;
      s.connect(f).connect(g).connect(o.music ? musicBus : sfxBus); s.start(0, Math.random()); n = { s, f, g }; return n;
    };
    return {
      set(level, freq){ if (!ac && level <= 0) return; const x = make(); if (!x) return; const t = ac.currentTime;
        x.g.gain.setTargetAtTime(Math.max(0, level) * (o.vol || 0.2), t, o.smooth || 0.05); if (freq) x.f.frequency.setTargetAtTime(freq, t, 0.06); }
    };
  },
  buzz(p, minGap = 35){
    if (!hapticsOn) return; const now = performance.now(); if (now - lastBuzz < minGap) return; lastBuzz = now;
    try { if (window.Haptic) Haptic.play(p); else if (navigator.vibrate) navigator.vibrate(p); } catch (e) {}   // phone's haptic engine in the app (ads.js)
  },
  rng(seed){ let a = seed | 0; return () => { a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; },
  canvas(w, h){ const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(w)); c.height = Math.max(1, Math.round(h)); return c; },
  toast(text){ const d = document.createElement('div'); d.className = 'toast'; d.textContent = text; document.body.appendChild(d); setTimeout(() => d.remove(), 1900); },
  hideHint(){ $('hint').classList.add('gone'); },
  actions(list){
    const box = $('actions'); box.innerHTML = '';
    const els = list.map(a => { const b = document.createElement('button'); b.className = 'pill' + (a.ghost ? ' ghost' : ''); b.textContent = a.label; if (a.id) b.id = a.id;
      b.addEventListener('click', () => { audio(); Ambient.start(); a.onClick(b); dirty = true; }); box.appendChild(b); return b; });
    requestAnimationFrame(measure); return els;
  }
};

// ---------- ambient pad, very quiet, in E minor or B minor ----------
// Each chord is [bass root, pitch classes above it]. The root sits alone in the bass; the three voices above are voiced
// as the inversion nearest the chord before (the last chord leads back into the first), so the pad glides instead of
// jumping and nothing but the bass goes below E3. The loop starts on the home chord, root doubled, and ends on VII, which leads home.
const PADS = {
  em: [[52, [4, 7, 11]], [48, [4, 7, 11]], [43, [11, 2, 4]], [50, [6, 9, 4]]],   // Em, Cmaj7, G6, D(add9)
  bm: [[47, [11, 2, 6]], [43, [11, 2, 6]], [50, [6, 9, 4]], [45, [1, 4, 11]]]    // Bm, Gmaj7, D(add9), A(add9)
};
// Of every inversion/octave of the chord inside [lo, hi], pick the one closest to the last voicing.
function voiceLead(prev, pcs, lo, hi){
  const n = pcs.length, pc = m => ((m % 12) + 12) % 12; let best = null, bs = Infinity;
  for (let inv = 0; inv < n; inv++) {
    const ord = pcs.slice(inv).concat(pcs.slice(0, inv));
    for (let b = lo; b <= hi; b++) {
      if (pc(b) !== pc(ord[0])) continue;
      const v = [b]; for (let i = 1; i < n; i++) { let m = v[i - 1] + 1; while (pc(m) !== pc(ord[i])) m++; v.push(m); }
      if (v[n - 1] > hi) break;
      let s = 0;
      if (prev && prev.length) { for (const x of v) s += Math.min(...prev.map(p => Math.abs(p - x))); for (const p of prev) s += 0.5 * Math.min(...v.map(x => Math.abs(p - x))); }
      else s = Math.abs((v[0] + v[n - 1]) / 2 - (lo + hi) / 2);
      if (s < bs) { bs = s; best = v; }
    }
  }
  if (best) return best;
  let b = lo; while (pc(b) !== pc(pcs[0])) b++; const v = [b]; for (let i = 1; i < n; i++) { let m = v[i - 1] + 1; while (pc(m) !== pc(pcs[i])) m++; v.push(m); } return v;
}
const voicedPads = {};
function padChords(key){   // voiced once per key; three passes make the loop seam as smooth as the rest
  if (voicedPads[key]) return voicedPads[key];

  for (let pass = 0; pass < 3; pass++) { out = []; for (const [root, pcs] of PADS[key]) { prev = voiceLead(prev, pcs, 52, 72); out.push([root, ...prev]); } }

const Ambient = (() => {
  let timer = null, step = 0, chimeTimer = null, cur = null;
  function chord(notes, t){
    for (const m of notes) {
      const f = mtof(m), o = ac.createOscillator(), o2 = ac.createOscillator(), lp = ac.createBiquadFilter(), g = ac.createGain();
      o.type = 'sine'; o2.type = 'triangle'; o.frequency.value = f; o2.frequency.value = f * 1.003;
      lp.type = 'lowpass'; lp.frequency.value = 1300;
      g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(0.016, t + 2.6); g.gain.setValueAtTime(0.016, t + 6.8); g.gain.linearRampToValueAtTime(0.0001, t + 9.8);
      o.connect(lp); o2.connect(lp); lp.connect(g).connect(musicBus); o.start(t); o2.start(t); o.stop(t + 10); o2.stop(t + 10);
    }
  }
  function chime(){
    if (!ac || !musicOn || !soundOn) return;
    const pcs = new Set((cur || padChords(TOY.pad || 'em')[0]).map(x => x % 12)), tones = [];   // a tone of the chord that's sounding
    for (let n = 74; n <= 90; n++) if (pcs.has(n % 12)) tones.push(n);
    const m = tones[Math.floor(Math.random() * tones.length)];
    C.tone(mtof(m), 2.6, 'sine', 0.035, null, 0, true); C.tone(mtof(m) * 2.76, 0.9, 'sine', 0.008, null, 0, true);

  }
  function tick(){ if (!ac) return; const prog = padChords(TOY.pad || 'em'); cur = prog[step % prog.length]; chord(cur, ac.currentTime + 0.1); step++; }
  return {
    start(){
      if (timer || !musicOn || !soundOn || document.hidden) return; if (!audio()) return;
      tick(); timer = setInterval(tick, 8000);
      if (TOY.chimes && !chimeTimer) chimeTimer = setTimeout(chime, 1500);
    },
    stop(){ clearInterval(timer); timer = null; clearTimeout(chimeTimer); chimeTimer = null; }
  };
})();

function applyToggles(){
  $('musicBtn').classList.toggle('off', !musicOn); $('soundBtn').classList.toggle('off', !soundOn); $('hapticBtn').classList.toggle('off', !hapticsOn);
  $('musicBtn').setAttribute('aria-pressed', String(musicOn)); $('soundBtn').setAttribute('aria-pressed', String(soundOn)); $('hapticBtn').setAttribute('aria-pressed', String(hapticsOn));
  if (ac) { sfxBus.gain.setTargetAtTime(soundOn ? 1 : 0, ac.currentTime, 0.05); musicBus.gain.setTargetAtTime(soundOn && musicOn ? 1 : 0, ac.currentTime, 0.2); }
  if (soundOn && musicOn) Ambient.start(); else Ambient.stop();

$('musicBtn').addEventListener('click', () => { musicOn = !musicOn; store.set('music', musicOn); audio(); applyToggles(); });
$('soundBtn').addEventListener('click', () => { soundOn = !soundOn; store.set('sound', soundOn); audio(); applyToggles(); });
$('hapticBtn').addEventListener('click', () => { hapticsOn = !hapticsOn; store.set('haptics', hapticsOn); applyToggles(); if (hapticsOn) C.buzz(20, 0); });

// Rainy Window: wipe the fog off a rainy window to see a cozy pixel scene. Drops slide down; the fog slowly creeps back.
const TOY = (() => {
  const SCENES = ['Night street', 'Forest cabin', 'Harbor lights'];
  let scene = 0, wx = 0, wy = 0, ww = 0, wh = 0, F = 14, sill = 26, art = null, base = null, frame = null, fog = null, fg = null, fw = 0, fh = 0, FS = 3, brush = null;
  let statics = [], sliders = [], streaks = [], nextDrop = 0, regrowT = 0, fogging = 0, flash = 0, thunderAt = 0, started = false;
  let bed = null, rumble = null, wipe = null, wiped = 0, sinceTick = 0;
  const rnd = (a, b) => a + Math.random() * (b - a);

  // ---------- pixel scenes, drawn once at low resolution ----------
  function bands(g, w, y0, y1, cols){ const bh = (y1 - y0) / cols.length; cols.forEach((col, i) => { g.fillStyle = col; g.fillRect(0, Math.round(y0 + i * bh), w, Math.ceil(bh) + 1); }); }

  function drawScene(){
    const pw = 120, ph = Math.max(80, Math.round(pw * wh / Math.max(1, ww)));
    art = C.canvas(pw, ph); const g = art.getContext('2d'), r = C.rng(scene * 1000 + 7);
    if (scene === 0) {
      bands(g, pw, 0, ph * 0.62, ['#0f1430', '#151b3b', '#1c2347', '#242b55']);
      g.fillStyle = '#ffffff'; for (let i = 0; i < 25; i++) g.fillRect(Math.floor(r() * pw), Math.floor(r() * ph * 0.35), 1, 1);
      disc(g, pw * 0.8, ph * 0.12, 5, '#f3efcf');
      for (let x = 0; x < pw;) { const w = 8 + Math.floor(r() * 10), h = ph * (0.25 + r() * 0.2); g.fillStyle = '#1a1f3d'; g.fillRect(x, ph * 0.62 - h, w, h); for (let wy2 = ph * 0.62 - h + 3; wy2 < ph * 0.6; wy2 += 4) for (let wx2 = x + 2; wx2 < x + w - 2; wx2 += 3) if (r() < 0.3) { g.fillStyle = r() < 0.8 ? '#f5c96a' : '#8fb7ff'; g.fillRect(wx2, wy2, 1, 2); } x += w + 1; }

      g.fillStyle = '#f5c96a'; g.fillRect(6, ph * 0.55, pw * 0.3, ph * 0.08); g.fillStyle = '#d4683f'; for (let x = 4; x < pw * 0.42; x += 4) g.fillRect(x, ph * 0.52, 2, 3);
      g.fillStyle = '#151829'; g.fillRect(0, ph * 0.7, pw, ph * 0.3);
      g.fillStyle = '#0b0d1c'; g.fillRect(pw * 0.68, ph * 0.38, 2, ph * 0.33); g.fillRect(pw * 0.66, ph * 0.38, 6, 2);
      glow(g, pw * 0.69, ph * 0.4, 14, '#f5c96a'); disc(g, pw * 0.69, ph * 0.4, 2, '#fff3c4');
      g.globalAlpha = 0.45; g.fillStyle = '#f5c96a'; for (let y = ph * 0.72; y < ph; y += 2) g.fillRect(pw * 0.68 + Math.round(Math.sin(y) * 1.5), y, 2, 1);
      g.fillStyle = '#f5c96a'; for (let y = ph * 0.74; y < ph; y += 3) g.fillRect(10 + Math.round(Math.sin(y * 2) * 2), y, pw * 0.25, 1);
      g.globalAlpha = 1; g.fillStyle = '#20253f'; g.fillRect(pw * 0.15, ph * 0.86, pw * 0.4, 2);
    } else if (scene === 1) {
      bands(g, pw, 0, ph * 0.6, ['#24183a', '#3c2556', '#5e3468', '#8b4a6c', '#b4677a']);
      disc(g, pw * 0.25, ph * 0.2, 4, '#f6dcc4');
      g.fillStyle = '#2b2245'; for (let x = 0; x < pw; x++) { const y = ph * 0.45 - 10 * Math.abs(Math.sin(x * 0.05 + 1)) - 6 * Math.sin(x * 0.13); g.fillRect(x, y, 1, ph); }
      for (let x = 0; x < pw; x += 4 + Math.floor(r() * 5)) pine(g, x, ph * 0.62 + r() * 4, 10 + Math.floor(r() * 8), '#1b2433');
      g.fillStyle = '#141c24'; g.fillRect(0, ph * 0.66, pw, ph);
      const cx = pw * 0.58, cy = ph * 0.66;
      g.fillStyle = '#3a2a22'; g.fillRect(cx - 18, cy - 16, 36, 16);
      g.fillStyle = '#2a1d18'; for (let i = 0; i < 10; i++) g.fillRect(cx - 21 + i, cy - 16 - i, 42 - i * 2, 1);
      g.fillStyle = '#2a1d18'; g.fillRect(cx + 9, cy - 30, 4, 10);
      glow(g, cx - 6, cy - 9, 12, '#ffc66b'); g.fillStyle = '#ffc66b'; g.fillRect(cx - 11, cy - 12, 10, 7); g.fillStyle = '#3a2a22'; g.fillRect(cx - 6, cy - 12, 1, 7); g.fillRect(cx - 11, cy - 9, 10, 1);
      g.fillStyle = 'rgba(160,150,180,0.5)'; for (let i = 0; i < 6; i++) disc(g, cx + 11 + i * 2, cy - 34 - i * 4, 2 + (i % 2), 'rgba(160,150,180,0.35)');
      for (let x = 0; x < pw; x += 3 + Math.floor(r() * 4)) pine(g, x, ph * 0.9 + r() * 6, 14 + Math.floor(r() * 10), '#0c1219');
      g.fillStyle = '#ffc66b'; g.globalAlpha = 0.25; g.fillRect(cx - 14, cy + 2, 16, 3); g.globalAlpha = 1;
    } else {
      bands(g, pw, 0, ph * 0.55, ['#0c1a2b', '#112640', '#173356', '#1e436a']);
      g.fillStyle = '#ffffff'; for (let i = 0; i < 30; i++) g.fillRect(Math.floor(r() * pw), Math.floor(r() * ph * 0.4), 1, 1);
      disc(g, pw * 0.3, ph * 0.16, 6, '#eef2ff');
      bands(g, pw, ph * 0.55, ph, ['#0d1f30', '#0b1a29', '#091522', '#07101b']);
      g.globalAlpha = 0.6; g.fillStyle = '#9fb8d8'; for (let y = ph * 0.56; y < ph; y += 3) g.fillRect(pw * 0.3 - 3 + Math.round(Math.sin(y * 1.7) * 3), y, 6, 1);
      g.fillStyle = '#5f8fb5'; for (let i = 0; i < 30; i++) g.fillRect(Math.floor(r() * pw), Math.floor(ph * 0.58 + r() * ph * 0.4), 2 + Math.floor(r() * 4), 1);
      g.globalAlpha = 1;
      const lx = pw * 0.8, ly = ph * 0.55;
      g.fillStyle = '#1c2633'; g.fillRect(lx - 6, ly - 2, 14, 4);
      for (let i = 0; i < 26; i++) { g.fillStyle = Math.floor(i / 5) % 2 ? '#e9e4dc' : '#c8463d'; g.fillRect(lx - 3 + Math.floor(i / 9), ly - 2 - i, 7 - Math.floor(i / 9) * 2, 1); }
      g.globalAlpha = 0.18; g.fillStyle = '#fff3c4'; for (let i = 0; i < 40; i++) g.fillRect(lx - 4 - i, ly - 30 - i * 0.25, 1, 2 + i * 0.35); g.globalAlpha = 1;
      disc(g, lx, ly - 30, 2, '#fff3c4');
      for (const [bx, bwid] of [[pw * 0.12, 16], [pw * 0.48, 12]]) { g.fillStyle = '#05090f'; g.fillRect(bx, ph * 0.66, bwid, 3); g.fillRect(bx + bwid / 2, ph * 0.66 - 12, 1, 12); g.fillRect(bx + bwid / 2 - 4, ph * 0.66 - 9, 4, 6); g.fillStyle = '#f5c96a'; g.fillRect(bx + 2, ph * 0.66 + 1, 1, 1); }
    }
  }
  function drawBase(){   // wall + the view outside, drawn once per scene instead of every frame
    base = C.canvas(C.W * C.DPR, C.H * C.DPR); const g = base.getContext('2d'); g.setTransform(C.DPR, 0, 0, C.DPR, 0, 0);
    const wall = g.createLinearGradient(0, 0, 0, C.H); wall.addColorStop(0, '#2a1f2c'); wall.addColorStop(1, '#171119'); g.fillStyle = wall; g.fillRect(0, 0, C.W, C.H);
    g.imageSmoothingEnabled = false; g.drawImage(art, wx, wy, ww, wh);
  }
  function drawFrame(){
    frame = C.canvas(C.W * C.DPR, C.H * C.DPR); const g = frame.getContext('2d'); g.setTransform(C.DPR, 0, 0, C.DPR, 0, 0);
    const wood = '#5c4130', light = '#7a573f', dark = '#3d2a1f';
    g.fillStyle = wood;
    g.fillRect(wx - F, wy - F, ww + 2 * F, F); g.fillRect(wx - F, wy + wh, ww + 2 * F, sill);
    g.fillRect(wx - F, wy, F, wh); g.fillRect(wx + ww, wy, F, wh);
    g.fillRect(wx + ww / 2 - 4, wy, 8, wh); g.fillRect(wx, wy + wh * 0.46 - 4, ww, 8);
    g.fillStyle = light; g.fillRect(wx - F, wy - F, ww + 2 * F, 3); g.fillRect(wx - F, wy + wh, ww + 2 * F, 4); g.fillRect(wx + ww / 2 - 4, wy, 2, wh);
    g.fillStyle = dark; g.fillRect(wx - F, wy + wh + sill - 4, ww + 2 * F, 4); g.fillRect(wx, wy + wh * 0.46 + 3, ww, 1);
    // a mug and a little plant on the sill
    const sy = wy + wh + 2, mx = wx + ww * 0.72;
    g.fillStyle = '#e9e4dc'; g.beginPath(); g.roundRect(mx, sy - 18, 20, 20, 3); g.fill(); g.strokeStyle = '#e9e4dc'; g.lineWidth = 3; g.beginPath(); g.arc(mx + 21, sy - 9, 5, -1.2, 1.2); g.stroke();
    g.fillStyle = '#d4683f'; g.fillRect(mx + 3, sy - 13, 14, 3);
    const px = wx + ww * 0.18;
    g.fillStyle = '#b5653f'; g.beginPath(); g.moveTo(px, sy - 14); g.lineTo(px + 20, sy - 14); g.lineTo(px + 17, sy + 2); g.lineTo(px + 3, sy + 2); g.closePath(); g.fill();
    g.fillStyle = '#5f9a52'; for (const [dx, dy, rr] of [[10, -20, 6], [4, -24, 5], [16, -25, 5], [10, -30, 5]]) { g.beginPath(); g.ellipse(px + dx, sy + dy, rr, rr * 0.7, 0.4, 0, Math.PI * 2); g.fill(); }
  }
  function makeFog(full = true){
    fw = Math.ceil(ww / FS); fh = Math.ceil(wh / FS);
    if (!fog || fog.width !== fw || fog.height !== fh) { fog = C.canvas(fw, fh); fg = fog.getContext('2d'); }
    if (full) {
      fg.globalCompositeOperation = 'source-over'; fg.fillStyle = 'rgb(225,231,238)'; fg.fillRect(0, 0, fw, fh);
      fg.globalCompositeOperation = 'destination-out';
      const r = C.rng(42); for (let i = 0; i < 60; i++) { fg.fillStyle = `rgba(0,0,0,${0.05 + r() * 0.1})`; fg.beginPath(); fg.arc(r() * fw, r() * fh, 2 + r() * 8, 0, Math.PI * 2); fg.fill(); }
      fg.globalCompositeOperation = 'source-over';
    }
    brush = C.canvas(24, 24); const b = brush.getContext('2d'), gr = b.createRadialGradient(12, 12, 1, 12, 12, 12);
    gr.addColorStop(0, 'rgba(0,0,0,1)'); gr.addColorStop(0.55, 'rgba(0,0,0,0.85)'); gr.addColorStop(1, 'rgba(0,0,0,0)'); b.fillStyle = gr; b.fillRect(0, 0, 24, 24);
  }
  function erase(x, y, rad){   // x, y in screen px
    const fx = (x - wx) / FS, fy = (y - wy) / FS, fr = rad / FS;
    fg.globalCompositeOperation = 'destination-out'; fg.drawImage(brush, fx - fr, fy - fr, fr * 2, fr * 2); fg.globalCompositeOperation = 'source-over';
  }
  function layout(){
    F = 14; sill = 26;
    wx = 16 + F; wy = C.top + 6 + F; ww = C.W - 2 * (16 + F); wh = Math.max(120, C.H - C.bottom - wy - sill - 6);
    drawScene(); drawBase(); drawFrame(); makeFog(true);
    const r = C.rng(5); statics = [];
    for (let i = 0; i < 95; i++) statics.push({ x: wx + r() * ww, y: wy + r() * wh, r: 0.8 + r() * r() * 2.4 });
    streaks = Array.from({ length: 46 }, () => ({ x: wx + Math.random() * ww, y: wy + Math.random() * wh, l: 6 + Math.random() * 10, v: 7 + Math.random() * 5 }));
    sliders = [];
  }
  function startAmbience(){
    if (started) return; started = true;
    bed.set(1); rumble.set(1); thunderAt = performance.now() + rnd(35000, 70000);
  }
  return {
    pad: 'bm',
    init(){
      bed = C.texture({ type: 'bandpass', freq: 1500, Q: 0.4, vol: 0.13, smooth: 0.8 });
      rumble = C.texture({ type: 'lowpass', freq: 200, Q: 0.5, vol: 0.09, smooth: 0.8 });
      wipe = C.texture({ type: 'bandpass', freq: 2600, Q: 1.4, vol: 0.2, smooth: 0.05 });
      C.actions([
        { label: 'Fog up', onClick: () => { fogging = 30; C.noise(1.2, 0.1, 'lowpass', 600, 0.7, 0, 1200); C.buzz(10, 0); } },
        { label: 'Scene', ghost: true, onClick: () => { scene = (scene + 1) % SCENES.length; drawScene(); drawBase(); C.toast(SCENES[scene]); } }
      ]);
      layout();
    },
    resize(){ layout(); },
    down(p){ startAmbience(); erase(p.x, p.y, 26); },
    move(p){
      const dx = p.x - p.px, dy = p.y - p.py, d = Math.hypot(dx, dy), n = Math.max(1, Math.ceil(d / 4));
      for (let i = 1; i <= n; i++) erase(p.px + dx * i / n, p.py + dy * i / n, 26);
      wiped += d; sinceTick += d;
      wipe.set(Math.min(1, Math.hypot(p.vx, p.vy) / 12), 2200 + Math.min(1600, Math.hypot(p.vx, p.vy) * 80));
      if (sinceTick > 70) { sinceTick = 0; C.buzz(4, 80); }
    },
    up(){ wipe.set(0); },
    update(k, dt){
      const now = performance.now();
      regrowT += dt;
      if (regrowT > 0.5) { regrowT = 0; fg.fillStyle = 'rgba(225,231,238,0.012)'; fg.fillRect(0, 0, fw, fh); }
      if (fogging > 0) { fogging--; fg.fillStyle = 'rgba(225,231,238,0.14)'; fg.fillRect(0, 0, fw, fh); }
      for (const s of streaks) { s.y += s.v * k; s.x -= s.v * 0.18 * k; if (s.y > wy + wh) { s.y = wy - s.l; s.x = wx + Math.random() * (ww + 40); } }
      if (now > nextDrop && sliders.length < 7) { nextDrop = now + rnd(1500, 3600); sliders.push({ x: wx + rnd(10, ww - 10), y: wy + rnd(0, wh * 0.4), r: rnd(2.4, 4.2), pause: 0, wob: rnd(0, 6) }); }
      for (const d of sliders) {
        if (d.pause > 0) { d.pause -= dt; continue; }
        d.y += (0.5 + d.r * 0.22 + Math.random() * 0.6) * k; d.x += Math.sin(d.y * 0.05 + d.wob) * 0.18 * k;
        if (Math.random() < 0.012 * k) d.pause = rnd(0.2, 0.9);
        erase(d.x, d.y, d.r * 1.8);
        for (let i = statics.length - 1; i >= 0; i--) { const s = statics[i]; if (Math.abs(s.x - d.x) < d.r + s.r && Math.abs(s.y - d.y) < d.r + s.r) { statics.splice(i, 1); d.r = Math.min(5.5, d.r + 0.08); } }
        if (Math.random() < 0.04 * k && statics.length < 170) statics.push({ x: d.x + rnd(-1, 1), y: d.y - d.r - 2, r: rnd(0.7, 1.3) });
        if (d.y > wy + wh - 3) { d.gone = true; if (started) C.noise(0.03, 0.025, 'bandpass', 1800, 4); }
      }
      sliders = sliders.filter(d => !d.gone);
      if (started && C.soundOn && Math.random() < 0.22 * k) C.noise(0.012, 0.012 + Math.random() * 0.03, 'highpass', 4500 + Math.random() * 3000, 0.7);
      if (started && thunderAt && now > thunderAt) {
        thunderAt = now + rnd(45000, 95000); flash = 1;
        C.noise(2.8, 0.2, 'lowpass', 180, 0.7, 0.25, 45); C.buzz([30, 60, 50], 0);
      }
      if (flash > 0) flash = Math.max(0, flash - 0.04 * k);
    },
    draw(c){
      c.drawImage(base, 0, 0, C.W, C.H);
      c.save(); c.beginPath(); c.rect(wx, wy, ww, wh); c.clip();
      c.strokeStyle = 'rgba(200,212,236,0.28)'; c.lineWidth = 1; c.beginPath();
      for (const s of streaks) { c.moveTo(s.x, s.y); c.lineTo(s.x - s.l * 0.18, s.y + s.l); } c.stroke();
      if (flash > 0) { c.fillStyle = `rgba(220,230,255,${flash * 0.5})`; c.fillRect(wx, wy, ww, wh); }
      c.globalAlpha = 0.84; c.drawImage(fog, wx, wy, ww, wh); c.globalAlpha = 1;
      for (const s of statics) {
        c.fillStyle = 'rgba(255,255,255,0.2)'; c.beginPath(); c.arc(s.x, s.y, s.r, 0, Math.PI * 2); c.fill();
        c.fillStyle = 'rgba(255,255,255,0.75)'; c.fillRect(s.x - s.r * 0.5, s.y - s.r * 0.5, 1, 1);
      }
      for (const d of sliders) {
        c.fillStyle = 'rgba(210,225,245,0.35)'; c.beginPath(); c.ellipse(d.x, d.y, d.r, d.r * 1.25, 0, 0, Math.PI * 2); c.fill();
        c.strokeStyle = 'rgba(20,30,50,0.35)'; c.lineWidth = 1; c.beginPath(); c.arc(d.x, d.y + 0.5, d.r, 0.2, Math.PI - 0.2); c.stroke();
        c.fillStyle = 'rgba(255,255,255,0.9)'; c.fillRect(d.x - d.r * 0.45, d.y - d.r * 0.6, 1.5, 1.5);
      }
      c.restore();
      c.drawImage(frame, 0, 0, C.W, C.H);
      const t = performance.now() / 1000, mx = wx + ww * 0.72 + 10, my = wy + wh - 18;
      c.strokeStyle = 'rgba(255,255,255,0.35)'; c.lineWidth = 2; c.beginPath();
      for (let i = 0; i < 3; i++) { const bx = mx - 5 + i * 5; c.moveTo(bx, my); for (let y = 0; y < 22; y += 2) c.lineTo(bx + Math.sin(t * 2 + y * 0.3 + i) * 2.5, my - y); }
      c.stroke();
    },
    peek(){
      const d = fg.getImageData(0, 0, fw, fh).data; let clear = 0, n = 0;
      for (let i = 3; i < d.length; i += 16) { n++; if (d[i] < 110) clear++; }
      return { clear: +(clear / n).toFixed(3), sliding: sliders.length, scene: SCENES[scene], wiped: Math.round(wiped), rect: { wx, wy, ww, wh } };
    }
  };
})();


// ---------- pointers (multi-touch, with coalesced events for smooth strokes) ----------
const pointers = new Map();
function at(e){ const r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
cv.addEventListener('pointerdown', e => {
  e.preventDefault(); audio(); Ambient.start(); C.hideHint();
  try { cv.setPointerCapture(e.pointerId); } catch (err) {}
  const q = at(e), p = { id: e.pointerId, x: q.x, y: q.y, px: q.x, py: q.y, sx: q.x, sy: q.y, vx: 0, vy: 0, t: performance.now(), dist: 0 };
  pointers.set(e.pointerId, p); if (TOY.down) TOY.down(p);
});
cv.addEventListener('pointermove', e => {
  const p = pointers.get(e.pointerId); if (!p) return; e.preventDefault();
  const list = e.getCoalescedEvents ? e.getCoalescedEvents() : [];
  for (const ev of (list.length ? list : [e])) {
    const q = at(ev), now = performance.now(), dt = Math.max(4, now - p.t);
    p.px = p.x; p.py = p.y; p.x = q.x; p.y = q.y;
    const dx = p.x - p.px, dy = p.y - p.py; p.dist += Math.hypot(dx, dy);
    p.vx = p.vx * 0.6 + dx / dt * 16.7 * 0.4; p.vy = p.vy * 0.6 + dy / dt * 16.7 * 0.4; p.t = now;
    if (TOY.move) TOY.move(p);
  }
});
const lift = e => { const p = pointers.get(e.pointerId); if (!p) return; pointers.delete(e.pointerId); if (TOY.up) TOY.up(p); };
cv.addEventListener('pointerup', lift); cv.addEventListener('pointercancel', lift);
cv.addEventListener('contextmenu', e => e.preventDefault());

// ---------- layout + loop ----------
function measure(){
  const tb = document.querySelector('.top').getBoundingClientRect(), ab = $('actions');
  C.top = tb.bottom + 4;
  C.bottom = ab.children.length ? H - ab.firstElementChild.getBoundingClientRect().top + 8 : 16;
  if (ready && TOY.resize) TOY.resize();
  dirty = true;
}
// Resolution adapts to the phone: 2x, 1.5x or 1x pixels. A slow phone steps down (live in the first
// seconds of a toy, otherwise from the next toy on, so nothing you made gets reset); a fast one steps back up.
let quality = 2, storedQ = null; try { storedQ = localStorage.getItem('calm_quality'); if (storedQ === '0' || storedQ === '1') quality = +storedQ; } catch (e) {}
if (storedQ === null && /Android/.test(navigator.userAgent) && ((navigator.deviceMemory || 8) <= 3 || (navigator.hardwareConcurrency || 8) <= 4)) quality = 1;   // modest Android phones start at 1.5x
const setQuality = q => { quality = q; try { localStorage.setItem('calm_quality', String(q)); } catch (e) {} };
const loadedAt = performance.now(); let ema = 16.7, slowN = 0, fastN = 0, stepped = false;
function resize(){
  DPR = Math.min(devicePixelRatio || 1, [1, 1.5, 2][quality]); W = innerWidth; H = innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR); ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  measure();
}
addEventListener('resize', resize);
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) dirty = true;   // the phone may have dropped the canvas while the app was away
  if (!ac) return;
  if (document.hidden) { Ambient.stop(); ac.suspend(); } else { ac.resume(); applyToggles(); }
});
if (document.fonts) { document.fonts.ready.then(() => { dirty = true; }); if (document.fonts.addEventListener) document.fonts.addEventListener('loadingdone', () => { dirty = true; }); }
let last = 0, drew = true, wasStill = false;
function frame(ts){
  requestAnimationFrame(frame);
  const dt = last ? Math.min(50, ts - last) : 16.7; last = ts;
  const k = dt / 16.7;
  if (!document.hidden && drew) {   // only a frame that follows a real draw says how fast this phone is
    ema = ema * 0.94 + dt * 0.06;
    slowN = ema > 21 ? slowN + (ema > 28 ? 2 : 1) : Math.max(0, slowN - 2);
    if (slowN > 45 && quality > 0) { setQuality(quality - 1); slowN = 0; ema = 16.7; stepped = true; if (performance.now() - loadedAt < 6000) resize(); }
    fastN = ema < 17.5 ? fastN + k : 0;   // counted in 60 Hz frames, so it takes 15 s of smooth running on any screen
    if (!stepped && fastN > 900 && quality < 2) { setQuality(quality + 1); fastN = 0; stepped = true; }
  }
  if (TOY.update) TOY.update(k, dt / 1000);
  // A toy at rest (no finger down, nothing moving) is drawn once and then left alone until something changes.
  const still = !pointers.size && !!(TOY.still && TOY.still());
  drew = !(still && wasStill && !dirty); wasStill = still;
  if (!drew) return;
  dirty = false;
  TOY.draw(ctx);
}
resize();
if (TOY.init) TOY.init();
ready = true; measure();
applyToggles();
requestAnimationFrame(frame);
window.Calm = { C, TOY, pointers };
})();
</script>
