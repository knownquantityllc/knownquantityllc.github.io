<style>
/* Layout: a handheld console filling the screen. Pixel screen on top, thumb controls below. Single retro look by choice. */
:root{
  --bg:#14121c; --ink:#f4efe4; --muted:#a39fb5; --panel:#1d1a28;
  --shell:#2bb3a3; --shell-dark:#1d7f74; --shell-light:#5fd6c8; --bezel:#2a2833; --btn:#3a3646; --btn-ink:#f4efe4;
  --red:#e43b44; --blue:#3e7bdb; --gold:#f7c331;
  --display:'Rubik Mono One',Impact,'Arial Black',sans-serif; --body:'Rubik',system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
:root[data-shell="berry"]{--shell:#d6457a;--shell-dark:#9c2a55;--shell-light:#f07aa3}
:root[data-shell="grape"]{--shell:#7b5cc4;--shell-dark:#53398f;--shell-light:#a68ce6}
:root[data-shell="kiwi"]{--shell:#7fbf3f;--shell-dark:#56882a;--shell-light:#a8dd6f}
:root[data-shell="dandelion"]{--shell:#f0c53a;--shell-dark:#b88f1c;--shell-light:#ffe07a}
:root[data-shell="atomic"]{--shell:#6d5c8f;--shell-dark:#4a3d66;--shell-light:#9c8cc0}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;touch-action:none}
body{background:radial-gradient(120% 70% at 50% 0%,#2a2540 0%,var(--bg) 65%) var(--bg)}
.wrap{height:100%;display:flex;justify-content:center;align-items:center;
  padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));box-sizing:border-box}
.shell{position:relative;width:min(100%,440px);max-height:100%;height:100%;max-height:820px;display:flex;flex-direction:column;
  background:linear-gradient(160deg,var(--shell-light) 0%,var(--shell) 22%,var(--shell) 70%,var(--shell-dark) 100%);
  border-radius:18px 18px 64px 18px;box-shadow:inset 0 -6px 0 rgba(0,0,0,.18),inset 0 3px 0 rgba(255,255,255,.25),0 18px 40px rgba(0,0,0,.45);
  padding:14px 14px 18px;box-sizing:border-box;gap:10px}
.bezel{background:var(--bezel);border-radius:12px 12px 36px 12px;padding:10px 12px 8px;box-shadow:inset 0 2px 0 rgba(255,255,255,.08);display:flex;flex-direction:column;gap:6px;flex:none}
.bezel-top{display:flex;align-items:center;gap:8px;font:600 9px var(--body);letter-spacing:.18em;color:#8e8a9e;text-transform:uppercase}
.bezel-top .stripes{flex:1;height:5px;background:linear-gradient(#e43b44 0 33%,transparent 33% 66%,#3e7bdb 66%);opacity:.8}
.led{width:8px;height:8px;border-radius:50%;background:#ff4757;box-shadow:0 0 8px #ff4757;flex:none}
.screen-wrap{position:relative;width:100%;aspect-ratio:160/144;background:#0b0a10;border-radius:4px;overflow:hidden}
#screen{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;display:block}
.screen-wrap::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(to bottom,rgba(0,0,0,0) 0 2px,rgba(0,0,0,.08) 2px 3px)}
.brand{text-align:center;font:400 13px var(--display);color:rgba(0,0,0,.35);letter-spacing:.06em;margin-top:2px;text-shadow:0 1px 0 rgba(255,255,255,.25);flex:none}
.controls{flex:1;min-height:150px;display:grid;grid-template-columns:1fr 1fr;align-items:center;position:relative}
.dpad{justify-self:start;display:flex;gap:4px;touch-action:none}
.dpad button{width:66px;height:66px;border-radius:12px;font-size:26px}
.ab{justify-self:end;position:relative;width:150px;height:130px;touch-action:none}
.ab button{position:absolute;width:68px;height:68px;border-radius:50%;font:400 14px var(--display);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0}
.ab button small{font:600 9px var(--body);letter-spacing:.1em;opacity:.8}
#bA{right:0;top:0;background:#c9334f}
#bB{left:0;bottom:0;background:#4a3f8f}
.ctrl{border:0;background:var(--btn);color:var(--btn-ink);box-shadow:0 5px 0 rgba(0,0,0,.35),inset 0 2px 0 rgba(255,255,255,.12);cursor:pointer;touch-action:none;padding:0}
.ctrl.on,.ctrl:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.35),inset 0 2px 0 rgba(255,255,255,.12)}
.ctrl:focus-visible{outline:3px solid #fff;outline-offset:2px}
.pills{position:absolute;left:50%;bottom:0;transform:translateX(-50%);display:flex;gap:14px}
.pill{width:58px;height:16px;border-radius:9px;border:0;background:rgba(0,0,0,.28);color:rgba(255,255,255,.7);font:600 8px var(--body);letter-spacing:.14em;cursor:pointer;padding:0}
.pill:focus-visible{outline:2px solid #fff}
/* overlays live inside the screen */
.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:10px;box-sizing:border-box;
  background:rgba(12,10,18,.86);text-align:center;overflow:auto}
.ov h1{font:400 clamp(18px,6.4vw,28px)/1 var(--display);margin:0;letter-spacing:.02em}
.ov h1 .r{color:var(--red)} .ov h1 .b{color:#6fa3ff}
.ov h2{font:400 clamp(14px,4.6vw,18px)/1.1 var(--display);margin:0}
.ov p{margin:0;color:var(--muted);font-size:12px;line-height:1.35;max-width:30ch}
.kqhint{position:absolute;top:8%;left:50%;transform:translateX(-50%);max-width:92%;width:max-content;padding:2px 8px;border-radius:3px;background:rgba(10,8,16,.8);color:#fff;font:600 clamp(10px,3.2vw,13px)/1.3 var(--body,Rubik),system-ui,sans-serif;text-align:center;pointer-events:none;transition:opacity .1s}
.menu{display:flex;flex-direction:column;gap:6px;width:min(220px,90%)}
.mbtn{font:600 13px var(--body);border:0;border-radius:8px;padding:9px 10px;background:#2e2a3c;color:var(--ink);cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.4)}
.mbtn.primary{background:var(--gold);color:#1a1405}
.mbtn:focus-visible{outline:2px solid #fff;outline-offset:2px}
.row{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.tog{font:600 11px var(--body);border:0;border-radius:999px;padding:6px 10px;background:#2e2a3c;color:var(--ink);cursor:pointer}
.tog[aria-pressed="false"]{opacity:.5;text-decoration:line-through}
.swatches{display:flex;gap:6px;justify-content:center}
.sw{width:20px;height:20px;border-radius:50%;border:2px solid rgba(255,255,255,.25);cursor:pointer;padding:0}
.sw[aria-pressed="true"]{border-color:#fff}
.worlds{display:flex;flex-direction:column;gap:7px;width:100%}
.world h3{margin:0 0 4px;font:600 10px var(--body);letter-spacing:.16em;text-transform:uppercase;color:var(--muted);text-align:left}
.lv{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.lvb{border:0;border-radius:7px;background:#2e2a3c;color:var(--ink);font:400 13px var(--display);padding:6px 0 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px}
.lvb .st{font:12px var(--body);letter-spacing:1px;color:var(--gold)}
.lvb .st i{font-style:normal;color:#4a4560}
.lvb[disabled]{opacity:.35;cursor:default}
.stars{font-size:28px;letter-spacing:4px;color:var(--gold)}
.stars i{font-style:normal;color:#3d3850}
.res{font-size:12px;color:var(--muted);display:grid;grid-template-columns:auto auto;gap:2px 12px;text-align:left}
.res b{color:var(--ink);font-weight:600}
@media (max-height:600px){.shell{border-radius:14px 14px 40px 14px;padding:10px}.dpad button{width:56px;height:56px}.ab{width:132px;height:110px}.ab button{width:58px;height:58px}}
@media (prefers-reduced-motion:reduce){.ctrl{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="shell">
    <div class="bezel">
      <div class="bezel-top"><span class="led" id="led"></span><span>Magnet power</span><span class="stripes"></span></div>
      <div class="screen-wrap">
        <canvas id="screen" width="160" height="144" aria-label="Game screen"></canvas>
        <div id="kqHint" class="kqhint" data-kq-notr aria-live="polite" style="opacity:0"></div>
        <div class="ov" id="ovTitle">
          <h1><span class="r">POLARITY</span> <span class="b">PIP</span></h1>
          <p>Red pulls blue. Same colors push. Flip your color to swing, stick and soar.</p>
          <div class="menu">
            <button class="mbtn primary" id="tPlay">Play</button>
            <div class="row"><button class="tog" id="tSound" aria-pressed="true">Sound</button><button class="tog" id="tMusic" aria-pressed="true">Music</button><button class="tog" id="tHaptic" aria-pressed="true">Vibration</button></div>
            <div class="swatches" id="swatches" aria-label="Console color"></div>
            <div class="row legal"><a class="tog" href="privacy.html?app" style="text-decoration:none;opacity:.75">Privacy policy</a><select data-kq-lang="short"></select></div>
          </div>
        </div>
        <div class="ov" id="ovSelect" hidden>
          <h2>Choose a level</h2>
          <div class="worlds" id="worlds"></div>
          <button class="mbtn" id="sBack">Back</button>
        </div>
        <div class="ov" id="ovPause" hidden>
          <h2>Paused</h2>
          <div class="menu">
            <button class="mbtn primary" id="pResume">Resume</button>
            <button class="mbtn" id="pRestart">Restart level</button>
            <button class="mbtn" id="pLevels">Levels</button>
            <button class="mbtn" id="pSkip" hidden>Skip this level</button>
            <div class="row"><button class="tog" id="pSound" aria-pressed="true">Sound</button><button class="tog" id="pMusic" aria-pressed="true">Music</button><button class="tog" id="pHaptic" aria-pressed="true">Vibration</button></div>
          </div>
        </div>
        <div class="ov" id="ovClear" hidden>
          <h2 id="cTitle">Level clear!</h2>
          <div class="stars" id="cStars"></div>
          <div class="res" id="cRes"></div>
          <div class="menu">
            <button class="mbtn primary" id="cNext">Next level</button>
            <div class="row"><button class="tog" id="cRetry">Retry</button><button class="tog" id="cLevels">Levels</button></div>
          </div>
        </div>
      </div>
    </div>
    <div class="brand">POLARITY PIP</div>
    <div class="controls">
      <div class="dpad" id="dpad"><button class="ctrl" id="bL" aria-label="Move left">◀</button><button class="ctrl" id="bR" aria-label="Move right">▶</button></div>
      <div class="ab"><button class="ctrl" id="bB" aria-label="Flip color">B<small>FLIP</small></button><button class="ctrl" id="bA" aria-label="Jump">A<small>JUMP</small></button></div>
      <div class="pills"><button class="pill" id="bStart" aria-label="Pause">START</button></div>
    </div>
  </div>
</div>
<script>
// Polarity Pip — deterministic game core (levels + physics). Runs in the browser and in Node (solver/tests).
// Units: pixels and 60 Hz frames. Polarity: +1 = red (N), -1 = blue (S). Opposites attract, same repels.
(function (root) {
'use strict';
const T = 8;
const C = {
  GRAV: 0.12, MAX_FALL: 3.6, RUN_MAX: 1.25, ACC_G: 0.11, ACC_A: 0.075, FRICTION: 0.7, AIR_DRAG: 0.985,
  JUMP_V: 2.35, JUMP_CUT: 0.9, COYOTE: 6, BUFFER: 6,
  MAG_R: 36, MAG_STR: 0.2, MAX_V: 4.4,
  KICK: 3.0, KICK_COOL: 10, REPEL: 0.55, CLING_SPEED: 0.85, RECLING: 8, HEAVY_MAX: 0.55,
  PULSE: 96, PW: 6, PH: 7
};
const EMPTY = 0, SOLID = 1, MN = 2, MS = 3, MP = 4, SPK_UP = 5, SPK_DN = 6;
const TILE_OF = { '#': SOLID, '=': SOLID, 'N': MN, 'S': MS, 'T': MP, '^': SPK_UP, 'v': SPK_DN };

// ------------------------------------------------------------------ levels
// Legend: # solid  N red magnet  S blue magnet  T pulse magnet (swaps every 1.6 s)  ^ v spikes
//         o bolt  P start  E exit  C checkpoint.  Falling off the bottom of the map is a miss.
// movers: magnet plates on rails {x,y,w,h in tiles, pol 'N'|'S', dx,dy travel in tiles, period frames}
const LEVELS = [];

function parse(def){
  const rows = def.map, h = rows.length, w = Math.max(...rows.map(r => r.length));
  const tiles = new Uint8Array(w * h);
  const L = { def, name: def.name, world: def.world, hint: def.hint || '', par: def.par || 60, w, h, tiles,
    start: null, exit: null, bolts: [], checkpoints: [], mags: [], pulses: [], hazards: [], movers: (def.movers || []).map(m => Object.assign({}, m)) };
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const ch = rows[y][x] || ' ';
    const t = TILE_OF[ch] || EMPTY;
    tiles[y * w + x] = t;
    if (t === MN || t === MS) L.mags.push({ x: x * T, y: y * T, w: T, h: T, pol: t === MN ? 1 : -1, tx: x, ty: y });
    if (t === MP) { const m = { x: x * T, y: y * T, w: T, h: T, pol: 0, pulse: true, tx: x, ty: y }; L.mags.push(m); L.pulses.push(m); }
    if (t === SPK_UP) L.hazards.push({ x: x * T + 1, y: y * T + 4, w: 6, h: 4 });
    if (t === SPK_DN) L.hazards.push({ x: x * T + 1, y: y * T, w: 6, h: 4 });
    if (ch === 'P') L.start = { x: x * T + 1, y: y * T + 1, tx: x, ty: y };
    if (ch === 'E') L.exit = { x: x * T, y: y * T, w: T, h: T, tx: x, ty: y };
    if (ch === 'o') L.bolts.push({ x: x * T + 4, y: y * T + 4 });
    if (ch === 'C') L.checkpoints.push({ x: x * T + 1, y: y * T + 1, tx: x, ty: y });
  }
  L.startPol = def.pol === 'S' ? -1 : 1;
  L.hasTime = L.pulses.length > 0 || L.movers.length > 0;
  return L;
}
const tileAt = (L, tx, ty) => (tx < 0 || tx >= L.w || ty < 0) ? SOLID : ty >= L.h ? EMPTY : L.tiles[ty * L.w + tx];
const isSolid = t => t === SOLID || t === MN || t === MS || t === MP;
const pulsePol = f => (Math.floor(f / C.PULSE) % 2 === 0) ? 1 : -1;
function moverRect(m, f){
  const p = (1 - Math.cos(2 * Math.PI * f / m.period)) / 2;
  return { x: (m.x + m.dx * p) * T, y: (m.y + m.dy * p) * T, w: m.w * T, h: m.h * T, pol: m.pol === 'S' ? -1 : 1 };
}
function magSources(L, f){
  const out = [];
  for (const m of L.mags) out.push(m.pulse ? { x: m.x, y: m.y, w: m.w, h: m.h, pol: pulsePol(f), mover: -1 } : { x: m.x, y: m.y, w: m.w, h: m.h, pol: m.pol, mover: -1 });
  L.movers.forEach((m, i) => { const r = moverRect(m, f); r.mover = i; out.push(r); });
  return out;
}

// ------------------------------------------------------------------ state
function newState(L){
  return { x: L.start.x, y: L.start.y, vx: 0, vy: 0, pol: L.startPol, f: 0, onGround: false, onMover: -1, coyote: 0, buf: 0,
    pj: false, pf: false, jumping: false, cling: null, reCling: 0, kickCool: 0, flipCool: 0, dead: false, won: false,
    bolts: 0, cp: -1, sx: L.start.x, sy: L.start.y, spol: L.startPol, airV: 0 };
}
const clone = s => Object.assign({}, s, { cling: s.cling ? Object.assign({}, s.cling) : null });
function respawn(L, s){
  Object.assign(s, { x: s.sx, y: s.sy, vx: 0, vy: 0, pol: s.spol, cling: null, dead: false, onGround: false, onMover: -1, coyote: 0, buf: 0, jumping: false, reCling: 0, kickCool: 0 });
}

// ------------------------------------------------------------------ collision
function overlapRect(ax, ay, aw, ah, b){ return ax < b.x + b.w - 0.001 && ax + aw > b.x + 0.001 && ay < b.y + b.h - 0.001 && ay + ah > b.y + 0.001; }
function solidsNear(L, s, movers){
  const out = [], x0 = Math.floor((s.x - 2) / T), x1 = Math.floor((s.x + C.PW + 2) / T), y0 = Math.floor((s.y - 2) / T), y1 = Math.floor((s.y + C.PH + 2) / T);
  for (let ty = y0; ty <= y1; ty++) for (let tx = x0; tx <= x1; tx++) if (isSolid(tileAt(L, tx, ty))) out.push({ x: tx * T, y: ty * T, w: T, h: T, mover: -1 });
  for (const r of movers) out.push(r);
  return out;
}
function moveAxis(L, s, movers, dx, dy){
  s.x += dx; s.y += dy;
  let hit = 0;
  for (const r of solidsNear(L, s, movers)) {
    if (!overlapRect(s.x, s.y, C.PW, C.PH, r)) continue;
    if (dx > 0) { s.x = r.x - C.PW; hit = 1; }
    else if (dx < 0) { s.x = r.x + r.w; hit = 1; }
    else if (dy > 0) { s.y = r.y - C.PH; hit = 2; if (r.mover >= 0) s.onMover = r.mover; }
    else if (dy < 0) { s.y = r.y + r.h; hit = 3; }
  }
  return hit;
}
function groundProbe(L, s, movers){
  for (const r of solidsNear(L, s, movers)) if (overlapRect(s.x + 0.5, s.y + C.PH, C.PW - 1, 0.6, r)) return r;
  return null;
}
// which magnet surfaces the player is touching
function contacts(s, srcs){
  const out = [];
  for (const m of srcs) {
    const hOver = s.x < m.x + m.w - 0.5 && s.x + C.PW > m.x + 0.5, vOver = s.y < m.y + m.h - 0.5 && s.y + C.PH > m.y + 0.5;
    if (hOver && Math.abs((m.y + m.h) - s.y) < 0.7) out.push({ side: 'top', pol: m.pol, mover: m.mover });
    if (hOver && Math.abs(m.y - (s.y + C.PH)) < 0.7) out.push({ side: 'bottom', pol: m.pol, mover: m.mover });
    if (vOver && Math.abs((m.x + m.w) - s.x) < 0.7) out.push({ side: 'left', pol: m.pol, mover: m.mover });
    if (vOver && Math.abs(m.x - (s.x + C.PW)) < 0.7) out.push({ side: 'right', pol: m.pol, mover: m.mover });
  }
  return out;
}
function magForce(s, srcs){
  const cx = s.x + C.PW / 2, cy = s.y + C.PH / 2;
  let ax = 0, ay = 0;
  for (const m of srcs) {
    const qx = Math.max(m.x, Math.min(cx, m.x + m.w)), qy = Math.max(m.y, Math.min(cy, m.y + m.h));
    const dx = cx - qx, dy = cy - qy, d = Math.hypot(dx, dy);
    if (d > C.MAG_R || d < 0.001) continue;
    const k = C.MAG_STR * (1 - d / C.MAG_R) * (1 - d / C.MAG_R) * (m.pol === s.pol ? C.REPEL : -1);
    ax += dx / d * k; ay += dy / d * k;
  }
  return [ax, ay];
}
const KICKS = { top: [0, 2.0], bottom: [0, -1], left: [2.6, -1.2], right: [-2.6, -1.2] };

// ------------------------------------------------------------------ step
// inp: { dir: -1|0|1, jump: held, flip: held }. Returns a list of event names for sound/haptics.
function step(L, s, inp){
  const ev = [];
  if (s.dead || s.won) return ev;
  s.f++;
  const movers = L.movers.map(m => Object.assign(moverRect(m, s.f), { mover: -1 }));
  L.movers.forEach((m, i) => { movers[i].mover = i; });
  // carry along with a moving plate we stand on or cling to
  const carry = s.cling && s.cling.mover >= 0 ? s.cling.mover : s.onMover;
  if (carry >= 0) {
    const a = moverRect(L.movers[carry], s.f - 1), b = moverRect(L.movers[carry], s.f);
    s.x += b.x - a.x; s.y += b.y - a.y;
  }
  for (const r of movers) if (overlapRect(s.x, s.y, C.PW, C.PH, r)) {   // a plate moved into us: get out of the way
    const pushes = [[r.x - C.PW - s.x, 0], [r.x + r.w - s.x, 0], [0, r.y - C.PH - s.y], [0, r.y + r.h - s.y]];
    pushes.sort((p, q) => Math.abs(p[0]) + Math.abs(p[1]) - Math.abs(q[0]) - Math.abs(q[1]));
    s.x += pushes[0][0]; s.y += pushes[0][1];
  }
  s.onMover = -1;
  const srcs = magSources(L, s.f);
  const jumpPress = inp.jump && !s.pj, flipPress = inp.flip && !s.pf;
  s.pj = !!inp.jump; s.pf = !!inp.flip;
  if (jumpPress) s.buf = C.BUFFER; else if (s.buf > 0) s.buf--;
  if (s.reCling > 0) s.reCling--; if (s.kickCool > 0) s.kickCool--; if (s.flipCool > 0) s.flipCool--;

  if (flipPress && s.flipCool <= 0) {
    s.pol = -s.pol; s.flipCool = 5; ev.push('flip');
    if (s.cling) {   // the surface we were stuck to now pushes us away
      const k = KICKS[s.cling.side];
      if (s.cling.side === 'bottom') s.vy = -C.KICK; else { s.vx = k[0]; s.vy = k[1]; }
      s.cling = null; s.reCling = C.RECLING; s.kickCool = C.KICK_COOL; ev.push('launch');
    }
  }
  const prevVy = s.vy, wasGround = s.onGround;

    const x = X(b.x) - Math.floor(w / 2), y = Y(b.y) - 2 + bob;
    g.fillStyle = '#a6721c'; g.fillRect(x, y + 1, w, 3); g.fillStyle = '#f7c331'; g.fillRect(x, y, w, 4);
    if (w > 2) { g.fillStyle = '#a6721c'; g.fillRect(x + Math.floor(w / 2), y + 1, 1, 2); }
  });
  // checkpoints
  L.checkpoints.forEach((c, i) => {
    const x = X(c.x + 2), y = Y(c.y - 1), on = S.cp === i;
    g.fillStyle = '#d7dce4'; g.fillRect(x, y, 1, 8);
    g.fillStyle = on ? '#7fdc6a' : '#8a8698'; const wave = on ? Math.floor(f / 10) % 2 : 0;
    g.fillRect(x + 1, y + wave, 4, 1); g.fillRect(x + 1, y + 1, 3, 1); g.fillRect(x + 1, y + 2 - wave, 2, 1);
  });
  // exit door
  if (L.exit) {
    const x = X(L.exit.x), y = Y(L.exit.y) - 4;
    g.fillStyle = '#1a1622'; g.fillRect(x, y, 8, 12); g.fillStyle = '#f7c331'; g.fillRect(x + 1, y + 1, 6, 11);
    g.fillStyle = '#c4922a'; g.fillRect(x + 2, y + 2, 4, 9); g.fillStyle = '#1a1622'; g.fillRect(x + 5, y + 7, 1, 1);
    if (Math.floor(f / 20) % 2) { g.fillStyle = '#ffffff'; g.fillRect(x + 3, y - 4, 2, 2); g.fillRect(x + 2, y - 3, 4, 1); }
  }
  // magnetic field: little pixels flowing toward attracting magnets and away from repelling ones
  if (!S.dead) {
    const px = S.x + 3, py = S.y + 3, srcs = PP.magSources(L, f);
    let shown = 0;
    for (const m of srcs) {
      const qx = Math.max(m.x, Math.min(px, m.x + m.w)), qy = Math.max(m.y, Math.min(py, m.y + m.h)), d = Math.hypot(px - qx, py - qy);
      if (d > C.MAG_R || d < 2 || shown > 7) continue; shown++;
      const attract = m.pol !== S.pol;
      for (let k = 0; k < 2; k++) {
        let tt = ((f * 0.04 + k * 0.5 + m.x * 0.013) % 1);
        if (attract) tt = 1 - tt;
        g.fillStyle = POL[m.pol].hi; g.fillRect(X(qx + (px - qx) * tt), Y(qy + (py - qy) * tt), 1, 1);
      }
    }
  }
  // Pip
  if (!S.dead && !(deadT > 0)) drawPip(g, X(S.x - 1), Y(S.y - 1), S, frame);
  // rings + particles
  for (const r of rings) { g.fillStyle = r.col; for (let a = 0; a < 16; a++) { const an = a / 16 * Math.PI * 2; g.fillRect(X(r.x + Math.cos(an) * r.r), Y(r.y + Math.sin(an) * r.r), 1, 1); } }
  for (const p of parts) { g.fillStyle = p.col; g.fillRect(X(p.x), Y(p.y), 1, 1); }
  // HUD
  g.fillStyle = 'rgba(10,8,16,.72)'; g.fillRect(0, 0, 160, 9);
  g.fillStyle = '#f7c331'; g.fillRect(2, 2, 5, 5); g.fillStyle = '#a6721c'; g.fillRect(4, 4, 1, 1);
  const got = bitCount(S.bolts);
  text(g, got + '/' + L.bolts.length, 9, 2, '#ffffff');
  text(g, (levelIdx + 1) + '-' + L.name, 32, 2, art.ui);
  const secs = (S.f / 60).toFixed(1); text(g, secs, 158 - textW(secs) - 10, 2, '#ffffff');
  g.fillStyle = POL[S.pol].base; g.fillRect(151, 1, 7, 7); text(g, S.pol > 0 ? 'N' : 'S', 153, 2, '#ffffff');
  // the pixel font has only Latin capitals, so other languages show the hint in an HTML bar over the screen
  const kqHint = document.getElementById('kqHint'), htmlHint = window.KQI18n && KQI18n.lang !== 'en';
  if (S.f < 300 && L.hint && htmlHint) {
    const t = KQI18n.t(L.hint); if (kqHint.textContent !== t) kqHint.textContent = t;
    kqHint.style.opacity = Math.max(0, S.f < 240 ? 1 : (300 - S.f) / 60);
  } else if (kqHint.style.opacity !== '0') kqHint.style.opacity = '0';
  if (S.f < 300 && L.hint && !htmlHint) {
    const a = S.f < 240 ? 1 : (300 - S.f) / 60; g.globalAlpha = Math.max(0, a);
    const w = textW(L.hint) + 8; g.fillStyle = 'rgba(10,8,16,.8)'; g.fillRect(80 - w / 2, 12, w, 9);
    text(g, L.hint, 80 - textW(L.hint) / 2, 14, '#ffffff'); g.globalAlpha = 1;
  }
  if (flash > 0) { g.globalAlpha = flash * 0.6; g.fillStyle = flashCol; g.fillRect(0, 0, 160, 144); g.globalAlpha = 1; }
}
// effects move with the game clock (60 steps a second), not the screen, so a 120 Hz phone plays them at the same speed
function stepFx(){
  if (shake > 0) { shake *= 0.85; if (shake < 0.4) shake = 0; }
  for (const r of rings) { r.r += 1.3; r.life--; }
  for (let i = rings.length - 1; i >= 0; i--) if (rings[i].life <= 0) rings.splice(i, 1);
  for (const p of parts) { p.x += p.vx; p.y += p.vy; p.vy += 0.06; p.life--; }
  if (parts.length) parts = parts.filter(p => p.life > 0);
  if (flash > 0) flash = Math.max(0, flash - 0.08);
}
const bitCount = n => { let c = 0; while (n) { c += n & 1; n >>>= 1; } return c; };
function drawTitleScene(){
  const t = frame;
  g.drawImage(BG[(Math.floor(t / 600)) % 3], -(t * 0.2 % 256), 0); g.drawImage(BG[(Math.floor(t / 600)) % 3], 256 - (t * 0.2 % 256), 0);
  g.fillStyle = 'rgba(10,8,16,.35)'; g.fillRect(0, 0, 160, 144);
  for (let i = 0; i < 10; i++) { drawMagTile(g, 20 + i * 12, 118, i % 2 ? 1 : -1, true); }
  const fake = { pol: Math.floor(t / 90) % 2 ? 1 : -1, onGround: true, vx: 0.5, cling: null, face: 1 };
  drawPip(g, Math.round(20 + ((t * 0.5) % 120)), 110, fake, t);
}

// ================================================================ flow + overlays
function showOv(id){ for (const o of ['ovTitle', 'ovSelect', 'ovPause', 'ovClear']) $(o).hidden = o !== id; }
function starsHtml(n, of = 3){ return '★'.repeat(n) + '<i>' + '★'.repeat(of - n) + '</i>'; }
function showSelect(){
  mode = 'select'; L = null; Snd.music('title');
  const box = $('worlds'); box.innerHTML = '';
  PP.WORLDS.forEach((wn, w) => {
    const sec = document.createElement('div'); sec.className = 'world'; sec.innerHTML = `<h3>World ${w + 1} · ${wn}</h3><div class="lv"></div>`;
    const grid = sec.querySelector('.lv');
    PP.LEVELS.forEach((lv, i) => {
      if (lv.world !== w) return;
      const b = document.createElement('button'); b.className = 'lvb'; const st = save.stars[i] || 0, locked = i > save.unlocked;
      b.innerHTML = `${i + 1}<span class="st">${locked ? '🔒' : starsHtml(st)}</span>`; b.disabled = locked;
      b.setAttribute('aria-label', `Level ${i + 1} ${lv.name}${locked ? ' locked' : ', ' + st + ' stars'}`);
      b.addEventListener('click', () => { Snd.play('select'); loadLevel(i); });
      grid.appendChild(b);
    });
    box.appendChild(sec);
  });
  showOv('ovSelect');
}
function pause(){ if (mode !== 'play') return; mode = 'paused'; syncToggles(); showOv('ovPause'); Snd.play('blip'); }
function resume(){ if (mode !== 'paused') return; mode = 'play'; showOv(null); }
function finishLevel(){
  const i = levelIdx, allBolts = bitCount(S.bolts) === L.bolts.length, fast = S.f <= L.par * 60;
  const stars = 1 + (allBolts ? 1 : 0) + (fast ? 1 : 0);
  save.stars[i] = Math.max(save.stars[i] || 0, stars);
  save.best[i] = Math.min(save.best[i] || 1e9, S.f); save.cleared[i] = true;
  save.unlocked = Math.max(save.unlocked, Math.min(PP.LEVELS.length - 1, i + 1)); persist();
  mode = 'clear';
  $('cTitle').textContent = i === PP.LEVELS.length - 1 ? 'You beat the factory!' : 'Level clear!';
  $('cStars').innerHTML = starsHtml(stars);
  $('cRes').innerHTML = `<span>Bolts</span><b>${bitCount(S.bolts)}/${L.bolts.length}${allBolts ? ' ★' : ''}</b><span>Time</span><b>${(S.f / 60).toFixed(1)}s (par ${L.par}s)${fast ? ' ★' : ''}</b><span>Misses</span><b>${deaths}</b>`;
  $('cNext').hidden = i >= PP.LEVELS.length - 1;
  showOv('ovClear');
}
function nextLevel(){
  const n = levelIdx + 1; if (n >= PP.LEVELS.length) return showSelect();
  loadLevel(n);
}
function skipLevel(){   // offered in the pause menu after three misses on a level: mark it cleared and move on
  save.cleared[levelIdx] = true; save.unlocked = Math.max(save.unlocked, Math.min(PP.LEVELS.length - 1, levelIdx + 1)); persist();
  levelIdx + 1 < PP.LEVELS.length ? loadLevel(levelIdx + 1) : showSelect();
}
function syncToggles(){
  for (const [ids, key] of [[['tSound', 'pSound'], 'sound'], [['tMusic', 'pMusic'], 'music'], [['tHaptic', 'pHaptic'], 'haptics']]) for (const id of ids) $(id).setAttribute('aria-pressed', String(!!save[key]));
}
function toggle(key){ save[key] = !save[key]; persist(); syncToggles(); if (key === 'music') Snd.setMusic(save.music); if (key === 'haptics' && save.haptics) buzz(20, true); Snd.play('blip'); }
for (const [id, key] of [['tSound', 'sound'], ['pSound', 'sound'], ['tMusic', 'music'], ['pMusic', 'music'], ['tHaptic', 'haptics'], ['pHaptic', 'haptics']]) $(id).addEventListener('click', () => toggle(key));
const SHELLS = { teal: '#2bb3a3', berry: '#d6457a', grape: '#7b5cc4', kiwi: '#7fbf3f', dandelion: '#f0c53a', atomic: '#6d5c8f' };
function setShell(k){ save.shell = k; persist(); document.documentElement.dataset.shell = k; document.querySelectorAll('.sw').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.k === k))); }
for (const [k, col] of Object.entries(SHELLS)) { const b = document.createElement('button'); b.className = 'sw'; b.dataset.k = k; b.style.background = col; b.setAttribute('aria-label', k + ' console'); b.addEventListener('click', () => { setShell(k); Snd.play('blip'); }); $('swatches').appendChild(b); }
setShell(save.shell in SHELLS ? save.shell : 'teal'); syncToggles();
$('tPlay').addEventListener('click', () => { Snd.ctx(); Snd.play('select'); showSelect(); });
$('sBack').addEventListener('click', () => { mode = 'title'; showOv('ovTitle'); });
$('pResume').addEventListener('click', resume);
$('pRestart').addEventListener('click', () => loadLevel(levelIdx));
$('pLevels').addEventListener('click', showSelect);
$('pSkip').addEventListener('click', skipLevel);
$('cNext').addEventListener('click', nextLevel);
$('cRetry').addEventListener('click', () => loadLevel(levelIdx));
$('cLevels').addEventListener('click', showSelect);

// ================================================================ controls (multi-touch, keyboard)
const held = new Map();   // pointerId -> control
function setCtl(name, on){
  if (name === 'L') input.left = on; else if (name === 'R') input.right = on; else if (name === 'A') input.jump = on; else if (name === 'B') input.flip = on;
  const el = { L: $('bL'), R: $('bR'), A: $('bA'), B: $('bB') }[name]; if (el) el.classList.toggle('on', on);
}
function ctlAt(x, y){
  const el = document.elementFromPoint(x, y); if (!el) return null;
  const b = el.closest('#bL,#bR,#bA,#bB'); return b ? { bL: 'L', bR: 'R', bA: 'A', bB: 'B' }[b.id] : null;
}
function refreshHeld(){ const on = new Set(held.values()); for (const k of ['L', 'R', 'A', 'B']) setCtl(k, on.has(k)); }
const ctrls = document.querySelector('.controls');
ctrls.addEventListener('pointerdown', e => {
  const k = ctlAt(e.clientX, e.clientY); if (!k) return;
  e.preventDefault(); Snd.ctx(); held.set(e.pointerId, k); try { ctrls.setPointerCapture(e.pointerId); } catch (err) {} refreshHeld();
  if (k === 'A' || k === 'B') buzz(6);
});
ctrls.addEventListener('pointermove', e => {
  if (!held.has(e.pointerId)) return;
  const k = ctlAt(e.clientX, e.clientY), was = held.get(e.pointerId);
  if ((was === 'L' || was === 'R') && (k === 'L' || k === 'R') && k !== was) { held.set(e.pointerId, k); refreshHeld(); }   // slide between left and right
});
const up = e => { if (held.delete(e.pointerId)) refreshHeld(); };
ctrls.addEventListener('pointerup', up); ctrls.addEventListener('pointercancel', up); ctrls.addEventListener('lostpointercapture', up);
$('bStart').addEventListener('click', () => { mode === 'play' ? pause() : mode === 'paused' ? resume() : null; });
const KEYS = { ArrowLeft: 'L', KeyA: 'L', ArrowRight: 'R', KeyD: 'R', Space: 'A', KeyW: 'A', ArrowUp: 'A', KeyJ: 'A', KeyZ: 'A', KeyK: 'B', KeyX: 'B', ShiftLeft: 'B', ShiftRight: 'B' };
addEventListener('keydown', e => {
  if (e.code === 'Escape' || e.code === 'KeyP' || (e.code === 'Enter' && mode === 'play')) { e.preventDefault(); mode === 'play' ? pause() : resume(); return; }
  const k = KEYS[e.code]; if (!k) return;
  if (mode === 'play') e.preventDefault();
  Snd.ctx(); setCtl(k, true);
});
addEventListener('keyup', e => { const k = KEYS[e.code]; if (k) setCtl(k, false); });
addEventListener('blur', () => { held.clear(); for (const k of ['L', 'R', 'A', 'B']) setCtl(k, false); });
document.addEventListener('visibilitychange', () => { if (document.hidden) { pause(); Snd.sleep(); } else if (mode !== 'play') Snd.wake(); });
// Android back button (ads.js): pause, step back through the menus, then to the background from the title
window.onBackButton = () => {
  if (mode === 'play') { pause(); return true; }
  if (mode === 'paused') { resume(); return true; }
  if (mode === 'select') { mode = 'title'; showOv('ovTitle'); Snd.play('blip'); return true; }
  if (mode === 'title') return 'exit';
  showSelect(); return true;
};
document.addEventListener('contextmenu', e => e.preventDefault());

// ================================================================ loop (fixed 60 Hz steps)
let acc = 0, last = 0;
function loop(ts){
  requestAnimationFrame(loop);
  const dt = last ? Math.min(100, ts - last) : 16.7; last = ts; acc += dt;
  let n = 0;
  while (acc >= 1000 / 60 && n < 5) { stepGame(inputNow()); stepFx(); acc -= 1000 / 60; n++; }
  if (n === 5) acc = 0;
  if (!n) return;                         // nothing moved since the last frame (120 Hz screens): keep the picture
  render();
  $('led').style.opacity = mode === 'play' ? 1 : 0.5 + 0.5 * Math.sin(ts / 300);
}
requestAnimationFrame(loop);
Snd.music('title');

// ================================================================ test hooks
window.PipGame = {
  get mode(){ return mode; }, get state(){ return S; }, get level(){ return levelIdx; }, get save(){ return save; },
  loadLevel, showSelect, pause, resume, nextLevel,
  // run a recorded input list through the real step function as fast as possible; returns the outcome
  replay(i, inputs){
    loadLevel(i);
    for (const [dir, jump, flip] of inputs) { stepGame({ dir, jump: !!jump, flip: !!flip }); if (mode !== 'play' || S.won) break; }
    for (let k = 0; k < 80 && mode === 'play'; k++) stepGame({ dir: 0, jump: false, flip: false });
    return { mode, won: S.won, frames: S.f, bolts: bitCount(S.bolts), deaths };
  },
  // run only the first n recorded frames (store screenshots: catch Pip mid-move)
  replayTo(i, inputs, n){
    loadLevel(i); let k = 0;
    for (const [dir, jump, flip] of inputs) { if (k++ >= n) break; stepGame({ dir, jump: !!jump, flip: !!flip }); if (mode !== 'play' || S.won) break; }
    return { f: S.f, cling: S.cling ? S.cling.side : null, x: Math.round(S.x), y: Math.round(S.y) };
  }
};
})();
</script>
